name: Apple native reliability
description: Qualify a single native Apple platform in its own checkout, Xcode scratch and simulator.
outputs:
  product-source-sha:
    description: Exact product source commit tested by this action.
    value: ${{ steps.checkout.outputs.product_source_sha }}
  product-source-tree-sha:
    description: Base product source tree SHA before allowlisted candidate overlays.
    value: ${{ steps.checkout.outputs.product_source_tree_sha }}
  test-harness-blob-sha:
    description: Git blob SHA of the iOS motion test harness used by candidate qualification.
    value: ${{ steps.checkout.outputs.test_harness_blob_sha }}
  dv-build-tool-blob-sha:
    description: Git blob SHA of the Apple DV runtime build helper used by candidate qualification.
    value: ${{ steps.checkout.outputs.dv_build_tool_blob_sha }}
  test-harness-overlay-applied:
    description: Whether the iOS motion test harness overlay was applied to the candidate tree.
    value: ${{ steps.checkout.outputs.test_harness_overlay_applied }}
  dv-build-tool-overlay-applied:
    description: Whether the Apple DV runtime helper overlay was applied to the candidate tree.
    value: ${{ steps.checkout.outputs.dv_build_tool_overlay_applied }}
  ios-compatibility-artifact-id:
    description: Artifact ID for the tested iOS simulator app when the compatibility check is deferred.
    value: ${{ steps.compatibility-upload.outputs.artifact-id }}
inputs:
  platform:
    description: iOS, macOS or tvOS.
    required: true
  build-only:
    description: Compile the app and XCTest targets without launching a simulator.
    required: false
    default: 'false'
  motion-test-only:
    description: Run the iPhone live motion XCTest on its own.
    default: 'false'
  defer-older-iphone-smoke:
    description: Publish a verified tested iOS app checkpoint before running the older iPhone simulator smoke.
    required: false
    default: 'false'
  candidate-source-sha:
    description: Optional exact frozen product source SHA for supplemental candidate qualification.
    required: false
    default: ''
  candidate-test-harness-sha:
    description: Exact tooling commit supplying the allowlisted iOS motion test harness overlay.
    required: false
    default: ''
  candidate-test-harness-in-product:
    description: Whether the test-harness overlay commit is already an ancestor of candidate product source.
    required: false
    default: 'false'
  candidate-dv-build-tool-sha:
    description: Exact tooling commit supplying the allowlisted Apple DV runtime build helper overlay.
    required: false
    default: ''
  candidate-dv-build-tool-in-product:
    description: Whether the Apple DV build-tool overlay commit is already an ancestor of candidate product source.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Prepare local Xcode and SwiftPM scratch
      id: scratch
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        case "$PLATFORM" in
          iOS)   project=ios;   sdk=iphonesimulator;  runtime=iOS;  destination='' ;;
          tvOS)  project=tvos;  sdk=appletvsimulator; runtime=tvOS; destination='' ;;
          macOS) project=macos; sdk='';               runtime='';   destination='platform=macOS' ;;
          *) echo "::error::Unsupported Apple platform $PLATFORM"; exit 1 ;;
        esac
        if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
          if [[ "$PLATFORM" == iOS ]]; then
            xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
            sdk_version="$(xcrun --sdk "$sdk" --show-sdk-version)"
            for version in "$xcode_version" "$sdk_version"; do
              if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]] ||
                 ! (( 10#${BASH_REMATCH[1]} > 27 || (10#${BASH_REMATCH[1]} == 27 && 10#${BASH_REMATCH[2]} >= 1) )); then
                echo "::error::iOS reliability requires Xcode and simulator SDK 27.1 or newer (Xcode $xcode_version, SDK $sdk_version)"
                exit 1
              fi
            done
          else
            xcodebuild -version | grep -Fx 'Xcode 27.0'
            test "$(xcrun --sdk "${sdk:-macosx}" --show-sdk-version)" = '27.0'
          fi
        fi
        [[ "$PUB_CACHE" == "$RUNNER_TEMP/apple-native-pub-$project" ]]
        [[ ! -e "$PUB_CACHE" && ! -L "$PUB_CACHE" ]]
        printf 'project=%s\nsdk=%s\nruntime=%s\ndestination=%s\n' \
          "$project" "$sdk" "$runtime" "$destination" >> "$GITHUB_OUTPUT"
        # Keep scratch paths scoped to this invocation of the composite.
        GITHUB_ENV="$GITHUB_OUTPUT" bash scripts/prepare_apple_jit_scratch.sh "$project" 20 local-xcode >/dev/null

    - name: Check out the exact source for this suite
      id: checkout
      shell: bash
      env:
        SUITE_ROOT: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
        APPLE_LOCAL_BUILD_DIR: ${{ steps.scratch.outputs.APPLE_LOCAL_BUILD_DIR }}
        APPLE_SCRATCH_JOB: ${{ steps.scratch.outputs.project }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        PLATFORM: ${{ inputs.platform }}
        BUILD_ONLY: ${{ inputs.build-only }}
        MOTION_TEST_ONLY: ${{ inputs.motion-test-only }}
        DEFER_OLDER_IPHONE_SMOKE: ${{ inputs.defer-older-iphone-smoke }}
        CANDIDATE_SOURCE_SHA: ${{ inputs.candidate-source-sha }}
        CANDIDATE_TEST_HARNESS_SHA: ${{ inputs.candidate-test-harness-sha }}
        CANDIDATE_TEST_HARNESS_IN_PRODUCT: ${{ inputs.candidate-test-harness-in-product }}
        CANDIDATE_DV_BUILD_TOOL_SHA: ${{ inputs.candidate-dv-build-tool-sha }}
        CANDIDATE_DV_BUILD_TOOL_IN_PRODUCT: ${{ inputs.candidate-dv-build-tool-in-product }}
      run: |
        set -euo pipefail
        harness_blob_sha=''
        dv_build_tool_blob_sha=''
        harness_overlay_applied=false
        dv_build_tool_overlay_applied=false
        [[ "$DEFER_OLDER_IPHONE_SMOKE" == true || "$DEFER_OLDER_IPHONE_SMOKE" == false ]]
        if [[ "$DEFER_OLDER_IPHONE_SMOKE" == true ]]; then
          [[ "$PLATFORM" == iOS && -n "$CANDIDATE_SOURCE_SHA" ]]
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$BUILD_ONLY" == false && "$MOTION_TEST_ONLY" == false ]]
        fi
        if [[ -n "$CANDIDATE_SOURCE_SHA" ]]; then
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$CANDIDATE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_TEST_HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_DV_BUILD_TOOL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_TEST_HARNESS_IN_PRODUCT" == true || "$CANDIDATE_TEST_HARNESS_IN_PRODUCT" == false ]]
          [[ "$CANDIDATE_DV_BUILD_TOOL_IN_PRODUCT" == true || "$CANDIDATE_DV_BUILD_TOOL_IN_PRODUCT" == false ]]
          for overlay_sha in "$CANDIDATE_TEST_HARNESS_SHA" "$CANDIDATE_DV_BUILD_TOOL_SHA"; do
            git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$overlay_sha"
          done
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$CANDIDATE_SOURCE_SHA"
          git -C "$GITHUB_WORKSPACE" worktree add --detach "$SUITE_ROOT" "$CANDIDATE_SOURCE_SHA"
          harness_path=ios/RunnerTests/AVFoundationMotionPlaybackTests.swift
          dv_build_tool_path=tools/dv-engine/build_apple_runtime.py
          mkdir -p "$SUITE_ROOT/$(dirname "$harness_path")" "$SUITE_ROOT/$(dirname "$dv_build_tool_path")"
          if [[ "$CANDIDATE_TEST_HARNESS_IN_PRODUCT" == true ]]; then
            harness_blob_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse "$CANDIDATE_SOURCE_SHA:$harness_path")"
          else
            git -C "$GITHUB_WORKSPACE" show "$CANDIDATE_TEST_HARNESS_SHA:$harness_path" > "$SUITE_ROOT/$harness_path"
            harness_blob_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse "$CANDIDATE_TEST_HARNESS_SHA:$harness_path")"
            harness_overlay_applied=true
          fi
          if [[ "$CANDIDATE_DV_BUILD_TOOL_IN_PRODUCT" == true ]]; then
            dv_build_tool_blob_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse "$CANDIDATE_SOURCE_SHA:$dv_build_tool_path")"
          else
            git -C "$GITHUB_WORKSPACE" show "$CANDIDATE_DV_BUILD_TOOL_SHA:$dv_build_tool_path" > "$SUITE_ROOT/$dv_build_tool_path"
            dv_build_tool_blob_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse "$CANDIDATE_DV_BUILD_TOOL_SHA:$dv_build_tool_path")"
            dv_build_tool_overlay_applied=true
          fi
          test "$(git -C "$GITHUB_WORKSPACE" hash-object "$SUITE_ROOT/$harness_path")" = "$harness_blob_sha"
          test "$(git -C "$GITHUB_WORKSPACE" hash-object "$SUITE_ROOT/$dv_build_tool_path")" = "$dv_build_tool_blob_sha"
          python3 - "$SUITE_ROOT" <<'PY'
        import subprocess
        import sys

        root = sys.argv[1]
        result = subprocess.run(
            ["git", "-C", root, "diff", "--name-only", "--"],
            check=True,
            text=True,
            capture_output=True,
        )
        allowed = {
            "ios/RunnerTests/AVFoundationMotionPlaybackTests.swift",
            "tools/dv-engine/build_apple_runtime.py",
        }
        changed = set(result.stdout.splitlines())
        unexpected = sorted(changed - allowed)
        if unexpected:
            raise SystemExit(f"Candidate source contains an unapproved overlay: {unexpected}")
        PY
        elif [[ -n "$CANDIDATE_TEST_HARNESS_SHA" || -n "$CANDIDATE_DV_BUILD_TOOL_SHA" \
              || "$CANDIDATE_TEST_HARNESS_IN_PRODUCT" != false || "$CANDIDATE_DV_BUILD_TOOL_IN_PRODUCT" != false ]]; then
          echo 'Candidate overlay commits require an exact candidate source SHA.' >&2
          exit 1
        elif [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
          python3 scripts/copy_apple_jit_sources.py "$GITHUB_WORKSPACE" "$SUITE_ROOT" "$GITHUB_SHA"
          bash scripts/clean_appledouble_sidecars.sh "$SUITE_ROOT"
        else
          git worktree add --detach "$SUITE_ROOT" "$GITHUB_SHA"
        fi
        ln -s "$APPLE_LOCAL_BUILD_DIR" "$SUITE_ROOT/build"
        printf 'product_source_sha=%s\n' "${CANDIDATE_SOURCE_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        if [[ -n "$CANDIDATE_SOURCE_SHA" ]]; then
          product_tree_sha="$(git -C "$SUITE_ROOT" rev-parse 'HEAD^{tree}')"
        else
          product_tree_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse "$GITHUB_SHA^{tree}")"
        fi
        printf 'product_source_tree_sha=%s\n' "$product_tree_sha" >> "$GITHUB_OUTPUT"
        if [[ -n "$CANDIDATE_SOURCE_SHA" ]]; then
          printf 'test_harness_blob_sha=%s\n' "$harness_blob_sha" >> "$GITHUB_OUTPUT"
          printf 'dv_build_tool_blob_sha=%s\n' "$dv_build_tool_blob_sha" >> "$GITHUB_OUTPUT"
          printf 'test_harness_overlay_applied=%s\n' "$harness_overlay_applied" >> "$GITHUB_OUTPUT"
          printf 'dv_build_tool_overlay_applied=%s\n' "$dv_build_tool_overlay_applied" >> "$GITHUB_OUTPUT"
        fi

    - name: Stage iOS DV runtime before compiling the Swift test host
      if: inputs.platform == 'iOS'
      id: ios-dv-runtime
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      env:
        APPLE_LOCAL_BUILD_DIR: ${{ steps.scratch.outputs.APPLE_LOCAL_BUILD_DIR }}
      run: |
        set -euo pipefail
        stage="$APPLE_LOCAL_BUILD_DIR/ios-dv-runtime"
        df -h "$APPLE_LOCAL_BUILD_DIR"
        python3 tools/dv-engine/build_apple_runtime.py --sdk iphonesimulator \
          --configuration Debug --arch arm64 --stage-dir "$stage"
        du -sh "$stage"
        df -h "$APPLE_LOCAL_BUILD_DIR"
        echo "path=$stage" >> "$GITHUB_OUTPUT"

    - name: Restore platform Pub dependencies
      id: pub
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.PUB_CACHE }}
        key: ${{ runner.os }}-${{ runner.arch }}-pub-${{ inputs.platform }}-v1-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

    - name: Check local CocoaPods lock checksums
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: ruby scripts/check_podspec_locks.rb

    - name: Build and verify iOS native torrent framework
      if: inputs.platform == 'iOS'
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      env:
        APPLE_LOCAL_BUILD_DIR: ${{ steps.scratch.outputs.APPLE_LOCAL_BUILD_DIR }}
      run: |
        python3 scripts/p2p/build_apple.py ios
        framework=packages/plezy_torrent/ios/Frameworks/ios/PlezyTorrent.xcframework
        test -f "$framework/Info.plist"
        test -d "$framework/ios-arm64/PlezyTorrent.framework"
        test -d "$framework/ios-arm64_x86_64-simulator/PlezyTorrent.framework"
        # Both slices are copied into the XCFramework. CocoaPods uses that
        # product, so the task's CMake checkouts and object files can go now.
        python3 -c 'from pathlib import Path; import shutil, sys; shutil.rmtree(Path(sys.argv[1]) / "p2p")' "$APPLE_LOCAL_BUILD_DIR"
        df -h "$APPLE_LOCAL_BUILD_DIR"

    - name: Build and verify macOS native torrent framework
      if: inputs.platform == 'macOS'
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: |
        python3 scripts/p2p/build_apple.py macos
        framework=packages/plezy_torrent/macos/Frameworks/macos/PlezyTorrent.xcframework
        test -f "$framework/Info.plist"
        test -d "$framework/macos-arm64_x86_64/PlezyTorrent.framework"

    - name: Install locked Dart dependencies
      if: inputs.platform != 'tvOS'
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: flutter pub get --enforce-lockfile --no-example

    - name: Stage verified SQLite libraries for iPhone simulator and host hooks
      if: inputs.platform == 'iOS'
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/prepare_native_downloads.py --ios-simulator-sqlite --cache-dir "$RUNNER_TEMP/ios-simulator-native-downloads"

    - name: Verify Sherpa ONNX iOS simulator framework
      if: inputs.platform == 'iOS'
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: |
        python3 - <<'PY'
        import hashlib
        import json
        from pathlib import Path
        from urllib.parse import unquote, urlparse

        config = json.loads(Path(".dart_tool/package_config.json").read_text())
        package = next(item for item in config["packages"] if item["name"] == "sherpa_onnx_ios")
        root = Path(unquote(urlparse(package["rootUri"]).path))
        framework = root / "ios/sherpa_onnx_ios/SherpaOnnxC.xcframework"
        simulator_binary = framework / "ios-arm64_x86_64-simulator/SherpaOnnxC.framework/SherpaOnnxC"
        if not (framework / "Info.plist").is_file() or not simulator_binary.is_file():
            raise SystemExit(f"Sherpa ONNX iOS simulator XCFramework is incomplete: {framework}")
        digest = hashlib.sha256(simulator_binary.read_bytes()).hexdigest()
        print(f"sherpa_onnx_ios_root={root}")
        print(f"sherpa_onnx_ios_simulator_binary={simulator_binary} bytes={simulator_binary.stat().st_size} sha256={digest}")
        PY

    - name: Install tvOS dependencies with the unsupported SMB native asset stub
      if: inputs.platform == 'tvOS'
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: tvos/scripts/pub_get.sh

    - name: Record committed CocoaPods lockfile
      if: inputs.platform != 'tvOS'
      env:
        APPLE_LOCAL_BUILD_DIR: ${{ steps.scratch.outputs.APPLE_LOCAL_BUILD_DIR }}
        PODFILE_LOCK: ${{ steps.scratch.outputs.project }}/Podfile.lock
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: |
        test -f "$PODFILE_LOCK"
        shasum -a 256 "$PODFILE_LOCK" > "$APPLE_LOCAL_BUILD_DIR/plezy-podfile-lock.sha256"

    - name: Verify iOS Xcode project syntax
      if: inputs.platform == 'iOS'
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: plutil -lint ios/Runner.xcodeproj/project.pbxproj

    - name: Refresh pinned iOS Swift packages
      if: inputs.platform == 'iOS'
      env:
        APPLE_SCRATCH_MODE: ${{ steps.scratch.outputs.APPLE_SCRATCH_MODE }}
        APPLE_SOURCE_PACKAGES_DIR: ${{ steps.scratch.outputs.APPLE_SOURCE_PACKAGES_DIR }}
        APPLE_DERIVED_DATA_PATH: ${{ steps.scratch.outputs.APPLE_DERIVED_DATA_PATH }}
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: scripts/refresh_apple_spm.sh ios

    - name: Prepare iOS Flutter build settings
      if: inputs.platform == 'iOS'
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: flutter build ios --config-only --simulator --debug --no-pub

    - name: Refresh pinned macOS Swift packages
      if: inputs.platform == 'macOS'
      env:
        APPLE_SCRATCH_MODE: ${{ steps.scratch.outputs.APPLE_SCRATCH_MODE }}
        APPLE_SOURCE_PACKAGES_DIR: ${{ steps.scratch.outputs.APPLE_SOURCE_PACKAGES_DIR }}
        APPLE_DERIVED_DATA_PATH: ${{ steps.scratch.outputs.APPLE_DERIVED_DATA_PATH }}
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: scripts/refresh_apple_spm.sh macos

    - name: Prepare macOS Flutter build settings
      if: inputs.platform == 'macOS'
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: flutter build macos --config-only --debug --no-pub

    - name: Prepare tvOS Flutter engine
      if: inputs.platform == 'tvOS'
      env:
        FLUTTER_TVOS_ENGINE_CACHE: ${{ steps.scratch.outputs.APPLE_LOCAL_BUILD_DIR }}/flutter-tvos-engine
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: tvos/scripts/fetch_engine.sh

    - name: Restore and verify committed CocoaPods lockfile
      if: inputs.platform != 'tvOS'
      env:
        APPLE_LOCAL_BUILD_DIR: ${{ steps.scratch.outputs.APPLE_LOCAL_BUILD_DIR }}
        PODFILE_LOCK: ${{ steps.scratch.outputs.project }}/Podfile.lock
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: |
        git restore --source=HEAD --worktree -- "$PODFILE_LOCK"
        shasum -a 256 --check "$APPLE_LOCAL_BUILD_DIR/plezy-podfile-lock.sha256"

    - name: Install locked CocoaPods dependencies
      if: inputs.platform != 'tvOS'
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}/${{ steps.scratch.outputs.project }}
      run: pod install --deployment

    - name: Diagnose iOS torrent CocoaPods integration
      if: inputs.platform == 'iOS'
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: |
        python3 - <<'PY'
        import json
        import plistlib
        from pathlib import Path

        plugin = Path("ios/.symlinks/plugins/plezy_torrent/ios")
        framework = Path("packages/plezy_torrent/ios/Frameworks/ios/PlezyTorrent.xcframework")
        print(f"plugin_path={plugin.resolve(strict=False)} exists={plugin.exists()}")
        print(f"framework_path={framework.resolve(strict=False)} exists={framework.exists()}")
        info = framework / "Info.plist"
        if info.is_file():
            with info.open("rb") as source:
                plist = plistlib.load(source)
            slices = [
                {key: item.get(key) for key in ("LibraryIdentifier", "SupportedPlatform", "SupportedPlatformVariant", "SupportedArchitectures")}
                for item in plist.get("AvailableLibraries", [])
            ]
            print(f"framework_slices={slices}")

        podspec = Path("ios/Pods/Local Podspecs/plezy_torrent.podspec.json")
        if podspec.is_file():
            spec = json.loads(podspec.read_text(encoding="utf-8"))
            print(f"vendored_frameworks={spec.get('vendored_frameworks')}")
        else:
            print(f"local_podspec_missing={podspec}")

        support = Path("ios/Pods/Target Support Files")
        for path in sorted(support.glob("*plezy_torrent*")):
            print(f"pod_support_path={path}")
            if path.is_dir():
                for child in sorted(path.rglob("*")):
                    if child.is_file() and child.suffix in {".sh", ".xcfilelist", ".json"}:
                        print(f"pod_support_file={child}")
                        for number, line in enumerate(child.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                            if "PlezyTorrent" in line or "XCFrameworkIntermediates" in line:
                                print(f"{child}:{number}:{line[:240]}")

        for path in sorted((support / "Pods-Runner").glob("Pods-Runner-frameworks*")):
            print(f"runner_framework_support_file={path}")
            if path.is_file():
                for number, line in enumerate(path.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                    if "plezy_torrent" in line or "PlezyTorrent" in line or "XCFrameworkIntermediates" in line:
                        print(f"{path}:{number}:{line[:240]}")

        for project_name, project in (
            ("Runner", Path("ios/Runner.xcodeproj/project.pbxproj")),
            ("Pods", Path("ios/Pods/Pods.xcodeproj/project.pbxproj")),
        ):
            print(f"{project_name}_project_file={project} exists={project.is_file()}")
            if project.is_file():
                for number, line in enumerate(project.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                    if any(token in line for token in ("plezy_torrent", "PlezyTorrent", "Copy XCFrameworks")):
                        print(f"{project_name}_project:{number}:{line[:240]}")

        sherpa_plugin = Path("ios/.symlinks/plugins/sherpa_onnx_ios")
        sherpa_podspec = sherpa_plugin / "ios/sherpa_onnx_ios.podspec"
        sherpa_source = sherpa_plugin / "ios/sherpa_onnx_ios/Sources/sherpa_onnx_ios/SherpaOnnxIosPlugin.swift"
        sherpa_framework = sherpa_plugin / "ios/sherpa_onnx_ios/SherpaOnnxC.xcframework"
        expected_source = "s.source_files = 'sherpa_onnx_ios/Sources/sherpa_onnx_ios/SherpaOnnxIosPlugin.swift'"
        print(f"sherpa_plugin={sherpa_plugin.resolve(strict=False)} exists={sherpa_plugin.exists()}")
        print(f"sherpa_source_exists={sherpa_source.is_file()} sherpa_framework_exists={sherpa_framework.is_dir()}")
        if not sherpa_podspec.is_file() or not sherpa_source.is_file() or not sherpa_framework.is_dir():
            raise SystemExit("resolved sherpa_onnx_ios package is missing its Podspec, source anchor, or XCFramework")
        if expected_source not in sherpa_podspec.read_text(encoding="utf-8"):
            raise SystemExit("sherpa_onnx_ios Podspec does not include the CocoaPods source anchor")

        sherpa_support = Path("ios/Pods/Target Support Files/sherpa_onnx_ios")
        copy_script = sherpa_support / "sherpa_onnx_ios-xcframeworks.sh"
        if not copy_script.is_file():
            raise SystemExit(f"CocoaPods did not generate {copy_script}")
        contents = copy_script.read_text(encoding="utf-8", errors="replace")
        has_framework = "SherpaOnnxC.xcframework" in contents
        print(f"sherpa_copy_script={copy_script} has_framework={has_framework}")
        if not has_framework:
            raise SystemExit(f"SherpaOnnxC is absent from {copy_script}")
        PY

    - name: Install tvOS CocoaPods dependencies
      if: inputs.platform == 'tvOS'
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: tvos/scripts/pod_install.sh

    - name: Verify tvOS project wiring
      if: inputs.platform == 'tvOS'
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: |
        ruby tvos/scripts/test_wire_mpv.rb
        ruby tvos/scripts/test_wire_top_shelf.rb

    - name: Remove AppleDouble sidecars from private native test sources
      if: runner.environment == 'self-hosted'
      env:
        APPLE_SCRATCH_JOB: ${{ steps.scratch.outputs.project }}
        SUITE_ROOT: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      shell: bash
      run: bash scripts/clean_appledouble_sidecars.sh "$SUITE_ROOT"

    - name: Resolve pinned Apple Swift packages for native tests
      env:
        APPLE_DERIVED_DATA_PATH: ${{ steps.scratch.outputs.APPLE_DERIVED_DATA_PATH }}
        APPLE_SOURCE_PACKAGES_DIR: ${{ steps.scratch.outputs.APPLE_SOURCE_PACKAGES_DIR }}
        NATIVE_WORKSPACE: ${{ steps.scratch.outputs.project }}/Runner.xcworkspace
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: xcodebuild -resolvePackageDependencies -workspace "$NATIVE_WORKSPACE" -scheme Runner -clonedSourcePackagesDirPath "$APPLE_SOURCE_PACKAGES_DIR" -derivedDataPath "$APPLE_DERIVED_DATA_PATH"

    - name: Remove AMSMB2 unsafe warning flag from the pinned tvOS checkout
      if: inputs.platform == 'tvOS'
      env:
        APPLE_SOURCE_PACKAGES_DIR: ${{ steps.scratch.outputs.APPLE_SOURCE_PACKAGES_DIR }}
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: |
        python3 scripts/patch_amsmb2_manifest.py \
          --source-packages-dir "$APPLE_SOURCE_PACKAGES_DIR" \
          --resolved-package tvos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

    - name: Select Apple test destination
      if: inputs.build-only != 'true'
      id: destination
      env:
        PREFERRED_SIMULATOR_TYPE: ${{ inputs.platform == 'iOS' && 'com.apple.CoreSimulator.SimDeviceType.iPhone-Duo' || '' }}
        SIMULATOR_RUNTIME: ${{ steps.scratch.outputs.runtime }}
        SIMULATOR_SDK: ${{ steps.scratch.outputs.sdk }}
        STATIC_DESTINATION: ${{ steps.scratch.outputs.destination }}
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: GITHUB_ENV="$GITHUB_OUTPUT" python3 scripts/apple/select_test_destination.py

    - name: Build CocoaPods aggregate framework
      if: inputs.platform != 'macOS'
      env:
        APPLE_DERIVED_DATA_PATH: ${{ steps.scratch.outputs.APPLE_DERIVED_DATA_PATH }}
        PODS_PROJECT: ${{ steps.scratch.outputs.project }}/Pods/Pods.xcodeproj
        PODS_SDK: ${{ steps.scratch.outputs.sdk }}
        PODS_SIMULATOR_PLATFORM: ${{ steps.scratch.outputs.runtime }}
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: |
        pods_products_dir="$APPLE_DERIVED_DATA_PATH/Build/Products/Debug-$PODS_SDK"
        xcodebuild build \
          -project "$PODS_PROJECT" \
          -scheme Pods-Runner \
          -configuration Debug \
          -sdk "$PODS_SDK" \
          -destination "generic/platform=$PODS_SIMULATOR_PLATFORM Simulator" \
          -derivedDataPath "$APPLE_DERIVED_DATA_PATH" \
          CONFIGURATION_BUILD_DIR="$pods_products_dir" \
          PODS_CONFIGURATION_BUILD_DIR="$pods_products_dir" \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          ARCHS=arm64
        test -f "$pods_products_dir/Pods_Runner.framework/Pods_Runner" || {
          echo "::error::CocoaPods aggregate framework binary is missing from $pods_products_dir/Pods_Runner.framework"
          exit 1
        }

    - name: Run Apple native reliability tests
      id: native-tests
      if: inputs.platform != 'macOS' && inputs.build-only != 'true'
      env:
        APPLE_LOCAL_BUILD_DIR: ${{ steps.scratch.outputs.APPLE_LOCAL_BUILD_DIR }}
        APPLE_DERIVED_DATA_PATH: ${{ steps.scratch.outputs.APPLE_DERIVED_DATA_PATH }}
        APPLE_RESULT_BUNDLE: ${{ steps.scratch.outputs.APPLE_RESULT_BUNDLE }}
        APPLE_SOURCE_PACKAGES_DIR: ${{ steps.scratch.outputs.APPLE_SOURCE_PACKAGES_DIR }}
        NATIVE_WORKSPACE: ${{ steps.scratch.outputs.project }}/Runner.xcworkspace
        APPLE_TEST_DESTINATION: ${{ steps.destination.outputs.APPLE_TEST_DESTINATION }}
        PLATFORM: ${{ inputs.platform }}
        MOTION_TEST_ONLY: ${{ inputs.motion-test-only }}
        IOS_DV_STAGE: ${{ steps.ios-dv-runtime.outputs.path }}
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: |
        result_bundle="$APPLE_RESULT_BUNDLE"
        test_log="$APPLE_LOCAL_BUILD_DIR/native-test-output.log"
        test_selection=()
        compiler_settings=()
        if [[ -n "$IOS_DV_STAGE" ]]; then
          compiler_settings+=("PLEAZYNG_PREBUILT_APPLE_DV_RUNTIME=$IOS_DV_STAGE")
        fi
        if [[ "$MOTION_TEST_ONLY" == true ]]; then
          test_selection=(-only-testing:RunnerTests/AVFoundationMotionPlaybackTests/testVideoMotionOptionsCanChangeOnAnOpenAVFoundationStream)
        fi
        set -o pipefail
        set +e
        gtimeout --kill-after=30s 75m xcodebuild test "${test_selection[@]}" \
          -workspace "$NATIVE_WORKSPACE" \
          -scheme Runner \
          -configuration Debug \
          -destination "$APPLE_TEST_DESTINATION" \
          -parallel-testing-enabled NO \
          -derivedDataPath "$APPLE_DERIVED_DATA_PATH" \
          -clonedSourcePackagesDirPath "$APPLE_SOURCE_PACKAGES_DIR" \
          -disableAutomaticPackageResolution \
          -resultBundlePath "$result_bundle" \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          ARCHS=arm64 "${compiler_settings[@]}" 2>&1 | tee "$test_log"
        test_status=$?
        set -e
        if [[ "$test_status" -ne 0 && -d "$result_bundle" ]]; then
          xcrun xcresulttool get test-results tests --path "$result_bundle" || true
        fi
        if [ "$PLATFORM" = "tvOS" ] && [ "$test_status" -eq 0 ]; then
          startup_results="$(dirname "$result_bundle")/native-test-results.json"
          xcrun xcresulttool get test-results tests --path "$result_bundle" > "$startup_results"
          python3 scripts/checks/check_tvos_startup_result.py "$startup_results"
        fi
        if [[ "$MOTION_TEST_ONLY" == true && "$test_status" == 0 ]]; then
          grep -Ei 'Test case .*testVideoMotionOptionsCanChangeOnAnOpenAVFoundationStream.* passed' "$test_log"
        fi
        exit "$test_status"

    - name: Create verified iOS compatibility app checkpoint
      id: compatibility-checkpoint
      if: inputs.defer-older-iphone-smoke == 'true' && inputs.platform == 'iOS' && steps.native-tests.outcome == 'success'
      env:
        APPLE_DERIVED_DATA_PATH: ${{ steps.scratch.outputs.APPLE_DERIVED_DATA_PATH }}
        APP_PRODUCTS: ${{ steps.scratch.outputs.APPLE_DERIVED_DATA_PATH }}/Build/Products/Debug-iphonesimulator
        PRODUCT_SOURCE_SHA: ${{ steps.checkout.outputs.product_source_sha }}
        CANDIDATE_SOURCE_SHA: ${{ inputs.candidate-source-sha }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      shell: bash
      run: |
        set -euo pipefail
        test "$PRODUCT_SOURCE_SHA" = "$CANDIDATE_SOURCE_SHA"
        checkpoint_dir="$RUNNER_TEMP/ios-compatibility-app-checkpoint"
        test ! -e "$checkpoint_dir" && test ! -L "$checkpoint_dir"
        mkdir -m 700 "$checkpoint_dir"
        archive="$checkpoint_dir/ios-simulator-app.zip"
        receipt="$checkpoint_dir/ios-simulator-app.json"
        python3 - "$GITHUB_WORKSPACE/scripts/apple/smoke_older_iphone.py" "$APP_PRODUCTS" <<'PY'
        import importlib.util
        import sys
        from pathlib import Path

        helper_path, products = sys.argv[1:]
        spec = importlib.util.spec_from_file_location("smoke_older_iphone", helper_path)
        if spec is None or spec.loader is None:
            raise SystemExit("Unable to load the hosted iOS scratch cleanup helper.")
        smoke = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(smoke)
        smoke.discard_hosted_intermediates(Path(products))
        PY
        app_path="$(python3 - <<'PY'
        import os
        import plistlib
        from pathlib import Path

        derived_data = Path(os.environ["APPLE_DERIVED_DATA_PATH"]).resolve(strict=True)
        products = Path(os.environ["APP_PRODUCTS"]).resolve(strict=True)
        runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
        expected_products = (derived_data / "Build/Products/Debug-iphonesimulator").resolve(strict=True)
        if products != expected_products or not products.is_relative_to(runner_temp):
            raise SystemExit("iOS compatibility app did not come from this job's scoped DerivedData.")
        apps = [path for path in products.glob("*.app")
                if not path.is_symlink() and (path / "Frameworks/App.framework").is_dir()]
        if len(apps) != 1:
            raise SystemExit(f"Expected exactly one tested Flutter simulator app, found {len(apps)}.")
        app = apps[0]
        info_path = app / "Info.plist"
        if info_path.is_symlink() or not info_path.is_file():
            raise SystemExit("Tested iOS simulator app has no regular Info.plist.")
        info = plistlib.loads(info_path.read_bytes())
        bundle_id = info.get("CFBundleIdentifier")
        executable = info.get("CFBundleExecutable")
        if not isinstance(bundle_id, str) or not bundle_id or not isinstance(executable, str) or not executable:
            raise SystemExit("Tested iOS simulator app identity is incomplete.")
        if not (app / executable).is_file():
            raise SystemExit("Tested iOS simulator app executable is missing.")
        print(app)
        PY
        )"
        ditto -c -k --norsrc --keepParent "$app_path" "$archive"
        python3 - "$app_path" "$archive" "$receipt" <<'PY'
        import hashlib
        import json
        import os
        import plistlib
        import re
        import sys
        import zipfile
        from pathlib import Path

        app, archive, receipt = (Path(value) for value in sys.argv[1:])
        product_sha = os.environ["PRODUCT_SOURCE_SHA"]
        run_id = os.environ["RUN_ID"]
        run_attempt = os.environ["RUN_ATTEMPT"]
        if not re.fullmatch(r"[0-9a-f]{40}", product_sha):
            raise SystemExit("Checkpoint product source SHA is invalid.")
        if not run_id.isdecimal() or not run_attempt.isdecimal():
            raise SystemExit("Checkpoint GitHub run identity is invalid.")
        with zipfile.ZipFile(archive) as zipped:
            names = [name for name in zipped.namelist() if name]
            roots = {name.split("/", 1)[0] for name in names}
            if roots != {app.name} or f"{app.name}/Info.plist" not in names:
                raise SystemExit("Checkpoint archive does not contain exactly the tested app bundle.")
        info = plistlib.loads((app / "Info.plist").read_bytes())
        digest = hashlib.sha256()
        with archive.open("rb") as stream:
            for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                digest.update(chunk)
        value = {
            "sha256": digest.hexdigest(),
            "product_source_sha": product_sha,
            "run_id": int(run_id),
            "run_attempt": int(run_attempt),
            "bundle_id": info["CFBundleIdentifier"],
        }
        receipt.write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")
        print(f"Verified tested iOS simulator app checkpoint for source {product_sha}.")
        PY

    - name: Upload tested iOS compatibility app checkpoint
      id: compatibility-upload
      if: inputs.defer-older-iphone-smoke == 'true' && inputs.platform == 'iOS' && steps.compatibility-checkpoint.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ios-compatibility-app-${{ github.run_id }}
        path: ${{ runner.temp }}/ios-compatibility-app-checkpoint/
        if-no-files-found: error
        overwrite: true
        compression-level: 0
        retention-days: 14

    - name: Launch the same iOS app on an older phone runtime
      if: inputs.platform == 'iOS' && inputs.build-only != 'true' && inputs.motion-test-only != 'true' && inputs.defer-older-iphone-smoke != 'true' && runner.environment == 'github-hosted'
      env:
        PRODUCTS: ${{ steps.scratch.outputs.APPLE_DERIVED_DATA_PATH }}/Build/Products/Debug-iphonesimulator
        SIMULATOR_RUNTIME: ${{ steps.scratch.outputs.runtime }}
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: |
        python3 scripts/apple/select_test_destination.py --cleanup
        python3 "$GITHUB_WORKSPACE/scripts/apple/smoke_older_iphone.py" "$PRODUCTS" --discard-intermediates

    - name: Build application and XCTest bundle
      if: inputs.platform == 'macOS' || inputs.build-only == 'true'
      env:
        APPLE_DERIVED_DATA_PATH: ${{ steps.scratch.outputs.APPLE_DERIVED_DATA_PATH }}
        APPLE_SOURCE_PACKAGES_DIR: ${{ steps.scratch.outputs.APPLE_SOURCE_PACKAGES_DIR }}
        NATIVE_WORKSPACE: ${{ steps.scratch.outputs.project }}/Runner.xcworkspace
        APPLE_TEST_DESTINATION: ${{ steps.destination.outputs.APPLE_TEST_DESTINATION || steps.scratch.outputs.destination || format('generic/platform={0} Simulator', inputs.platform) }}
        IOS_DV_STAGE: ${{ steps.ios-dv-runtime.outputs.path }}
      shell: bash
      working-directory: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
      run: |
        compiler_settings=()
        if [[ -n "$IOS_DV_STAGE" ]]; then
          compiler_settings+=("PLEAZYNG_PREBUILT_APPLE_DV_RUNTIME=$IOS_DV_STAGE")
        fi
        if [[ -n "${PLEAZYNG_APPLE_TIDY:-}" ]]; then
          mkdir -p "$RUNNER_TEMP/pleazyng-clang-database"
          compiler_settings+=(
            "PLEAZYNG_CLANG_DB_DIR=$RUNNER_TEMP/pleazyng-clang-database"
            'OTHER_CFLAGS=$(inherited) -gen-cdb-fragment-path "$(PLEAZYNG_CLANG_DB_DIR)"'
            'OTHER_CPLUSPLUSFLAGS=$(inherited) -gen-cdb-fragment-path "$(PLEAZYNG_CLANG_DB_DIR)"'
          )
        fi
        xcodebuild build-for-testing \
          -workspace "$NATIVE_WORKSPACE" \
          -scheme Runner \
          -configuration Debug \
          -destination "$APPLE_TEST_DESTINATION" \
          -derivedDataPath "$APPLE_DERIVED_DATA_PATH" \
          -clonedSourcePackagesDirPath "$APPLE_SOURCE_PACKAGES_DIR" \
          -disableAutomaticPackageResolution \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          ARCHS=arm64 "${compiler_settings[@]}"
        if [[ -n "${PLEAZYNG_APPLE_TIDY:-}" ]]; then
          database="$RUNNER_TEMP/pleazyng-clang-database"
          python3 "$GITHUB_WORKSPACE/scripts/checks/clang_compilation_fragments.py" "$database"
          python3 "$GITHUB_WORKSPACE/scripts/checks/native_lint.py" clang --tool "$PLEAZYNG_APPLE_TIDY" \
            --database "$database" --compiled-root "$PWD" --changed-lines "$PLEAZYNG_APPLE_TIDY_BASE"
        fi

    - name: Retain failed Apple native test results
      if: failure() && inputs.platform != 'macOS' && inputs.build-only != 'true' && steps.scratch.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: apple-native-results-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ steps.scratch.outputs.APPLE_RESULT_BUNDLE }}
          ${{ steps.scratch.outputs.APPLE_LOCAL_BUILD_DIR }}/native-test-output.log
        retention-days: 7
        if-no-files-found: warn

    - name: Remove job-owned Apple test simulator
      if: always() && steps.scratch.outcome == 'success' && inputs.platform != 'macOS' && inputs.build-only != 'true'
      shell: bash
      env:
        SIMULATOR_RUNTIME: ${{ steps.scratch.outputs.runtime }}
        APPLE_JIT_JOB_STATUS: ${{ job.status }}
      run: python3 scripts/apple/select_test_destination.py --cleanup

    - name: Retain Apple simulator ownership receipt
      if: always() && steps.destination.outputs.APPLE_SIMULATOR_RECEIPT != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: apple-simulator-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.destination.outputs.APPLE_SIMULATOR_RECEIPT }}
        retention-days: 7

    - name: Save platform Pub dependencies
      if: success() && steps.pub.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.PUB_CACHE }}
        key: ${{ steps.pub.outputs.cache-primary-key }}

    - name: Clean Apple build scratch
      if: always() && steps.scratch.outcome == 'success'
      shell: bash
      env:
        APPLE_JIT_JOB_STATUS: ${{ job.status }}
        APPLE_HOSTED_SCRATCH: ${{ steps.scratch.outputs.APPLE_HOSTED_SCRATCH }}
        PLEZYNG_HOSTED_APPLE_SCRATCH_ROOT: ${{ steps.scratch.outputs.PLEZYNG_HOSTED_APPLE_SCRATCH_ROOT }}
        APPLE_SCRATCH_JOB: ${{ steps.scratch.outputs.project }}
        SUITE_ROOT: ${{ steps.scratch.outputs.PLEZYNG_APPLE_WORKSPACE }}
        CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        PLATFORM: ${{ inputs.platform }}
        APPLE_CACHE_SLUG: ${{ steps.scratch.outputs.project }}
      run: |
        if [[ "$APPLE_HOSTED_SCRATCH" == 1 && "$APPLE_JIT_JOB_STATUS" != cancelled && "$CHECKOUT_OUTCOME" == success ]]; then
          git worktree remove --force "$SUITE_ROOT"
        fi
        bash scripts/cleanup_apple_jit_scratch.sh "$APPLE_SCRATCH_JOB"
        if [[ "$APPLE_JIT_JOB_STATUS" != cancelled ]]; then
          [[ "$PUB_CACHE" == "$RUNNER_TEMP/apple-native-pub-$APPLE_CACHE_SLUG" ]]
          rm -rf -- "$PUB_CACHE"
        fi
