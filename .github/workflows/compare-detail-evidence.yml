name: Verify golden scenes and repaired playback paths
on:
  push:
    branches: [qualification/detail-appearance-20261121]
permissions:
  contents: read
jobs:
  appearance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out revision for validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: d2d732253675272f373a4e088413c4dc463d1daa
          fetch-depth: 1
          persist-credentials: false

      - name: Load pinned Flutter SDK
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pull-request-pub-v1-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install system dependencies
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          sudo python3 scripts/configure_hosted_apt.py "$RUNNER_ENVIRONMENT"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang build-essential cmake ffmpeg

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prefetch checksum-pinned host native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform linux --arch x64

      - name: Check all 24 appearance fixtures in their normal order
        run: flutter test --no-pub -j 1 test/appearance/appearance_golden_test.dart
      - name: Check rotation, downloaded handoff and Home row editing
        if: ${{ !cancelled() }}
        run: |
          flutter test --no-pub -j 2 test/widgets/video_controls_startup_chrome_test.dart test/utils/video_player_navigation_test.dart test/screens/settings/home_layout_settings_screen_test.dart
      - name: Retain any visual regressions
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: complete-appearance-differences
          path: test/appearance/failures/*.png
          if-no-files-found: ignore
          retention-days: 7
