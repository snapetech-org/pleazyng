# ng-runner-policy: hosted-default-v2
# CI defaults to public GitHub-hosted runners. A trusted main release can
# explicitly select its private Apple runner for the unsigned native tests.
name: CI - Sanity Checks
run-name: ${{ format('action:{0}:pool:{1}:apple:{2}', inputs.action, inputs.runner_pool, inputs.apple_runner_pool) }}

# Validation is opt-in: choose a ref from Actions and dispatch this workflow.
on:
  workflow_call:
    inputs:
      action:
        type: string
        default: ci
      runner_pool:
        type: string
        default: public
      execution_profile:
        type: string
        default: hybrid
      build_linux_packages:
        type: boolean
        default: true
      apple_runner_pool:
        type: string
        default: hosted
  workflow_dispatch:
    inputs:
      action:
        description: Run all checks or just the iPhone live motion test
        required: true
        type: choice
        options: [ci, ios-motion]
        default: ci
      runner_pool:
        description: Public GitHub-hosted runners
        required: true
        type: choice
        options: [public]
        default: public
      execution_profile:
        description: Use standard hosted runners for compatible Linux, Windows, and Apple validation work
        required: true
        type: choice
        options: [hybrid]
        default: hybrid
      build_linux_packages:
        description: >
          Manually smoke-build Linux packages when changing linux/packaging.
          This is separate from release assets and does not run on ordinary pushes.
        default: false
        type: boolean
      apple_runner_pool:
        description: Standalone CI uses hosted macOS for unsigned Apple validation
        required: false
        type: choice
        options: [hosted]
        default: hosted

env:
  GH_TOKEN: ${{ github.token }}
  # Keep SDK analytics failures separate from build and analysis diagnostics.
  DASH__SUPPRESS_ANALYTICS: "true"
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  # Each setup step loads the immutable SDK manifest after checkout.
  TRUSTED_BUILD_CACHE_VERSION: trusted-build-v1

jobs:
  # Every compatible CI lane uses its native public GitHub-hosted runner.
  analyze:
    name: Code Analysis
    if: ${{ inputs.action != 'ios-motion' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Validate the requested runner profile
        shell: bash
        env:
          RUNNER_POOL_INPUT: ${{ inputs.runner_pool }}
          EXECUTION_PROFILE_INPUT: ${{ inputs.execution_profile }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_POOL_INPUT" != "public" ]]; then
            echo "CI requires the public GitHub-hosted runner pool." >&2
            exit 1
          fi
          if [[ "$EXECUTION_PROFILE_INPUT" != "hybrid" ]]; then
            echo "Unsupported execution profile: $EXECUTION_PROFILE_INPUT" >&2
            exit 1
          fi
          if [[ "$EXECUTION_PROFILE_INPUT" == "hybrid" && "$GITHUB_REF" != "refs/heads/main" && ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The hybrid CI profile requires trusted main or an immutable version tag." >&2
            exit 1
          fi
          {
            echo "Execution profile: **$EXECUTION_PROFILE_INPUT** (public GitHub-hosted runners)."
            echo "Compatible Linux, Windows, and Apple validation jobs use standard GitHub-hosted runners."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Manual CI skips changelog range checks, so avoid fetching all history on ephemeral runners.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 1 || 0 }}
          persist-credentials: false

      - name: Validate changelog entry
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          CHANGELOG_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CHANGELOG_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$CHANGELOG_BASE" || "$CHANGELOG_BASE" =~ ^0+$ ]]; then
            echo "No previous commit is available for changelog range validation."
            exit 0
          fi
          python3 scripts/changelog.py validate --mode range --base "$CHANGELOG_BASE" --head "$CHANGELOG_HEAD"

      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install dependencies
        run: |
          sudo python3 scripts/configure_hosted_apt.py '${{ runner.environment }}'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang build-essential cmake
          flutter pub get --enforce-lockfile

      - name: Prefetch checksum-pinned host native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform linux --arch x64

      - name: Install wakelock_plus development dependencies
        working-directory: packages/wakelock_plus
        run: flutter pub get --enforce-lockfile --no-example

      - name: Verify generated files committed
        run: scripts/codegen.sh --check

      - name: Verify translation hygiene
        run: |
          python3 scripts/checks/clean_translations.py --check --strict
          python3 scripts/checks/check_localizations.py
          python3 scripts/codegen/generate_localized_quantities.py --check
          python3 scripts/codegen/generate_platform_locales.py --check

      - name: Verify workflow and script guards
        run: bash scripts/ci_guard_checks.sh

      - name: Verify formatting
        run: bash scripts/format_dart.sh --check

      - name: Verify icon consistency
        run: dart run scripts/checks/check_icon_consistency.dart

      - name: Analyze code
        run: dart run scripts/checks/check_analyzer.dart

      - name: Check for unused code
        run: |
          echo "🔍 Checking for unused code..."
          dart run dart_code_linter:metrics check-unused-code lib 2>&1 | tee unused_code.txt
          if grep -qi "no unused code found" unused_code.txt; then
            echo "✅ No unused code found"
          else
            echo "❌ Found unused code:"
            cat unused_code.txt
            exit 1
          fi

      - name: Check for unused files
        run: |
          echo "🔍 Checking for unused files..."
          dart run dart_code_linter:metrics check-unused-files lib 2>&1 | tee unused_files.txt
          if grep -qi "no unused files found" unused_files.txt; then
            echo "✅ No unused files found"
          else
            echo "❌ Found unused files:"
            cat unused_files.txt
            exit 1
          fi

  test-shards:
    name: Flutter unit and widget tests (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    if: ${{ inputs.action != 'ios-motion' && inputs.execution_profile == 'hybrid' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    timeout-minutes: 80
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install unit test system dependencies
        run: |
          sudo python3 scripts/configure_hosted_apt.py '${{ runner.environment }}'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang build-essential ffmpeg

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get --enforce-lockfile

      - name: Prefetch checksum-pinned host native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform linux --arch x64

      - name: Run Flutter test shard
        run: python3 scripts/ci/flutter_test_shard.py ${{ matrix.shard }}

  test-extras:
    name: Media and plugin tests
    if: ${{ inputs.action != 'ios-motion' && inputs.execution_profile == 'hybrid' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install unit test system dependencies
        run: |
          sudo python3 scripts/configure_hosted_apt.py '${{ runner.environment }}'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang build-essential ffmpeg

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get --enforce-lockfile

      - name: Prefetch checksum-pinned host native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform linux --arch x64

      - name: Decode fault-injected manual recordings
        run: dart scripts/checks/verify_manual_capture_recovery.dart

      - name: Run TV platform acceptance tests
        run: |
          flutter test --no-pub -j 2 --dart-define=PLEZY_TIZEN=true \
            test/utils/tizen_platform_test.dart \
            test/services/tizen_plex_playback_test.dart \
            test/games/game_catalog_screen_test.dart
          flutter test --no-pub -j 2 --dart-define=PLEZY_WEBOS=true \
            test/services/webos_plex_playback_test.dart \
            test/services/webos_jellyfin_playback_test.dart \
            test/games/game_catalog_screen_test.dart

      - name: Install wakelock_plus test dependencies
        working-directory: packages/wakelock_plus
        run: flutter pub get --enforce-lockfile

      - name: Run wakelock_plus VM tests
        working-directory: packages/wakelock_plus
        run: flutter test test/wakelock_plus_linux_plugin_test.dart

      - name: Configure Flutter Chrome executable
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -x "$browser_path"
          printf 'CHROME_EXECUTABLE=%s\n' "$browser_path" >> "$GITHUB_ENV"

      - name: Run wakelock_plus Chrome tests
        working-directory: packages/wakelock_plus
        timeout-minutes: 10
        run: flutter test --platform chrome --timeout 60s --dart-define=WEB_PLUGIN_TESTS=true test/wakelock_plus_web_plugin_test.dart

      # The vendored atomic-write patch has to keep the upstream contract, not
      # just the new behaviour. Upstream's own suites are the check for that.
      - name: Run the vendored desktop preference store tests
        run: |
          for pkg in shared_preferences_linux shared_preferences_windows; do
            (cd "packages/$pkg" && flutter pub get --enforce-lockfile && flutter test)
          done

  reader-browser:
    name: Reader browser tests
    if: ${{ inputs.action != 'ios-motion' && inputs.execution_profile == 'hybrid' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node for reader browser checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/reader-tests/package-lock.json

      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-reader-pub-v1-${{ hashFiles('pubspec.lock') }}

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install reader browser dependencies
        working-directory: tools/reader-tests
        run: |
          npm ci --ignore-scripts
          npm exec -- playwright install --with-deps chromium

      - name: Run real reader browser checks
        working-directory: tools/reader-tests
        run: npm test

  test:
    name: Unit Tests
    needs: [test-shards, test-extras, reader-browser]
    if: ${{ inputs.action != 'ios-motion' && always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: test "$SHARDS" = success && test "$EXTRAS" = success && test "$BROWSER" = success
        env:
          SHARDS: ${{ needs.test-shards.result }}
          EXTRAS: ${{ needs.test-extras.result }}
          BROWSER: ${{ needs.reader-browser.result }}

  android-test:
    name: Android JVM and Native Tests
    if: ${{ inputs.action != 'ios-motion' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.execution_profile != 'hybrid' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    timeout-minutes: 150
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify public runner access to Maven Central mirror
        if: ${{ inputs.execution_profile == 'hybrid' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --head --max-time 30 \
            https://storage.googleapis.com/maven-central/maven2/org/robolectric/nativeruntime-dist-compat/1.0.18/nativeruntime-dist-compat-1.0.18.jar

      - name: Restore Android FFmpeg source cache
        id: ffmpeg-source-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/pleazyng-ffmpeg-source
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-ffmpeg-source-${{ hashFiles('android/app/build.gradle.kts') }}

      - name: Prepare verified Android FFmpeg source archive
        shell: bash
        env:
          PLEZY_EXECUTION_PROFILE: ${{ inputs.execution_profile }}
        run: |
          if [[ "$PLEZY_EXECUTION_PROFILE" == "hybrid" ]]; then
            python3 scripts/prepare_android_ffmpeg_source.py --direct-egress "$RUNNER_TEMP/pleazyng-ffmpeg-source/ffmpeg-9.0.2.tar.xz"
          else
            python3 scripts/prepare_android_ffmpeg_source.py "$RUNNER_TEMP/pleazyng-ffmpeg-source/ffmpeg-9.0.2.tar.xz"
          fi

      - name: Save Android FFmpeg source cache
        if: steps.ffmpeg-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/pleazyng-ffmpeg-source
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-ffmpeg-source-${{ hashFiles('android/app/build.gradle.kts') }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false

      - name: Install all pinned Android module toolchains
        if: ${{ inputs.execution_profile != 'hybrid' }}
        run: python3 scripts/prepare_android_sdk.py install

      - name: Install pinned Android module toolchains with direct egress
        if: ${{ inputs.execution_profile == 'hybrid' }}
        run: python3 scripts/prepare_android_sdk.py install --direct-egress

      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install shared Gradle repositories
        run: python3 scripts/prepare_gradle_repositories.py

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure Android local properties
        run: printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties

      - name: Verify Android host native test toolchain
        run: |
          python3 - <<'PY'
          import shutil
          import sys

          required = ("clang", "clang++", "cmake", "ninja", "make", "c++")
          missing = [tool for tool in required if shutil.which(tool) is None]
          if missing:
              print(
                  "The private Android test runner is missing pre-provisioned native tools: "
                  + ", ".join(missing),
                  file=sys.stderr,
              )
              raise SystemExit(1)
          for tool in required:
              print(f"{tool}: {shutil.which(tool)}")
          PY

      - name: Configure Android host native tests
        run: |
          cmake -S android/app/src/test/cpp -B build/android-host-tests \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build Android host native tests
        run: cmake --build build/android-host-tests --parallel 2

      - name: Run Android host native tests
        run: |
          ctest --test-dir build/android-host-tests \
            --output-on-failure --no-tests=error

      - name: Run Android JVM unit tests
        working-directory: android
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/android-jvm-tests-${attempt}.log"
            ./gradlew :app:testDebugUnitTest :saf_util:testDebugUnitTest :libass:testDebugUnitTest \
              -x :app:compileFlutterBuildDebug --continue --console=plain \
              -Dorg.gradle.internal.http.connectionTimeout=60000 \
              -Dorg.gradle.internal.http.socketTimeout=120000 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            echo "::group::Android Gradle failure resource diagnostics (attempt $attempt)"
            date --iso-8601=seconds
            free -h
            df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
            df -i "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
            for file in /proc/pressure/memory /proc/pressure/io \
                        /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.high \
                        /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
              if [[ -r "$file" ]]; then
                echo "== $file =="
                cat "$file"
              fi
            done
            dmesg --time-format=iso 2>/dev/null \
              | grep -Ei 'out of memory|oom-kill|killed process' \
              | tail -20
            echo "::endgroup::"
            if ! grep -Eiq 'Could not (GET|download)|Read timed out|Connection reset|Connection timed out|UnknownHostException|Temporary failure in name resolution|No route to host|ProxyError|tunnel.*failed' "$log_file"; then
              exit "$status"
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Gradle still failed after three attempts because a dependency download could not complete."
              exit "$status"
            fi
            delay=$((attempt * 20))
            echo "Transient Gradle dependency download failure; retrying the Android JVM tests in ${delay}s (attempt ${attempt}/3)."
            sleep "$delay"
          done

      - name: Upload Android JVM test reports
        if: ${{ inputs.action != 'ios-motion' && always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-jvm-test-reports-${{ github.run_id }}
          path: |
            build/**/test-results/testDebugUnitTest/*.xml
            build/**/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Gradle daemon before Android API compatibility check
        working-directory: android
        run: ./gradlew --stop

      - name: Check Android API compatibility
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Verify Games embedded manifests and cancellation patches
        run: python3 -m unittest discover -s scripts/games -p 'test_*.py'

      - name: Build embedded Moonlight and Steam Android modules
        working-directory: android
        run: ./gradlew :moonlight:assembleDebug :steam:assembleDebug :steam:testDebugUnitTest --stacktrace

  native-format:
    name: Native Formatting
    if: ${{ inputs.action != 'ios-motion' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.execution_profile != 'hybrid' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    timeout-minutes: 20
    runs-on: macos-26-intel
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify native formatting
        run: scripts/format_native.sh --check

      - name: Verify tvOS native asset platform and framework metadata checks
        run: python3 -m unittest scripts.checks.test_tvos_native_assets scripts.checks.test_tvos_framework_metadata

  linux-native-test:
    name: Linux native reliability (${{ matrix.sanitizer }})
    if: ${{ inputs.action != 'ios-motion' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.execution_profile != 'hybrid' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.execution_profile == 'hybrid' && 2 || 1 }}
      matrix:
        include:
          - sanitizer: address
            lifecycle_sanitizers: ON
          - sanitizer: thread
            lifecycle_sanitizers: OFF
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Linux native test dependencies
        run: |
          sudo python3 scripts/configure_hosted_apt.py '${{ runner.environment }}'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev \
            libstdc++-12-dev libmpv-dev libepoxy-dev libcurl4-openssl-dev libevdev-dev \
            libwayland-dev libegl-dev libvulkan-dev mesa-vulkan-drivers \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Build bundled MilkRust for Linux
        shell: bash
        run: python3 scripts/visualizer/build_runtime.py --platform linux --architectures "x64" --output build/visualizer-native

      - name: Prepare Flutter Linux configuration
        run: |
          flutter pub get --enforce-lockfile --no-example
          flutter build linux --debug --config-only --no-pub

      - name: Configure Linux native reliability tests
        run: |
          cmake -S linux -B build/linux-native-${{ matrix.sanitizer }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPLEZY_BUILD_MPV_PLAYER_LIFECYCLE_TESTS=ON \
            -DPLEZY_MPV_LIFECYCLE_SANITIZERS=${{ matrix.lifecycle_sanitizers }} \
            -DPLEZY_BUILD_MPV_RELIABILITY_TESTS=ON \
            -DPLEZY_MPV_RELIABILITY_SANITIZER=${{ matrix.sanitizer }}

      # `pleazyng` is the runner itself. Without it nothing in CI ever compiles
      # my_application.cc, mpv_plugin.cc or the Wayland video plane — the
      # reliability test targets each pull in only a couple of translation units,
      # so a break in the rest of linux/runner reached a release build unseen.
      - name: Build Linux native reliability tests
        run: |
          cmake --build build/linux-native-${{ matrix.sanitizer }} --parallel 2 --target \
            pleazyng \
            mpv_player_lifecycle_test \
            mpv_player_hdr_output_test \
            music_dual_core_test \
            mpv_property_result_contract_test \
            webos_media_slots_test \
            mpris_metadata_test \
            system_tone_map_test \
            hdr_metadata_test \
            plane_geometry_test \
            video_params_test \
            experimental_render_api_test \
            plane_render_executor_test

      # Older TSan runtimes reject high mmap entropy. Tune it when exposed,
      # but always execute the tests: unavailable tuning is not qualification.
      - name: Set ThreadSanitizer-compatible ASLR entropy
        if: matrix.sanitizer == 'thread'
        run: |
          if ! current_bits="$(sysctl -n vm.mmap_rnd_bits)" || [[ ! "$current_bits" =~ ^[0-9]+$ ]]; then
            echo "::warning::Kernel mmap entropy is unavailable; executing ThreadSanitizer tests without tuning."
            exit 0
          fi
          if [ "$current_bits" -gt 28 ]; then
            if ! sudo -n sysctl -w vm.mmap_rnd_bits=28; then
              echo "::warning::Kernel mmap entropy cannot be lowered; ThreadSanitizer tests must still pass."
            fi
          fi

      - name: Run Linux native reliability tests
        run: |
          ctest --test-dir build/linux-native-${{ matrix.sanitizer }} \
            --output-on-failure --no-tests=error

      - name: Prepare pinned Steam sources
        if: matrix.sanitizer == 'address'
        run: python3 scripts/games/prepare_steam.py

      - name: Configure Steam transport tests with sanitizers
        if: matrix.sanitizer == 'address'
        run: |
          cmake -S native/games/steam -B build/games-steam-tests \
            -DPLEZY_STEAM_TESTS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build Steam transport tests
        if: matrix.sanitizer == 'address'
        run: cmake --build build/games-steam-tests --parallel 2

      - name: Run Steam transport and adapter tests
        if: matrix.sanitizer == 'address'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/games-steam-tests --output-on-failure

  apple-native-suite:
    name: Apple native reliability (${{ matrix.platform }})
    if: ${{ inputs.action != 'ios-motion' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.execution_profile != 'hybrid' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            slug: macos
          - platform: tvOS
            slug: tvos
    # Native tests and their simulator dependencies build arm64 on every platform.
    runs-on: ${{ inputs.apple_runner_pool == 'private' && github.event_name == 'workflow_dispatch' && github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main' && github.workflow_ref == 'snapetech-org/pleazyng/.github/workflows/build.yml@refs/heads/main' && fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-apple-native-test-{1}"]}}', github.run_id, matrix.slug)) || 'macos-26' }}
    permissions:
      contents: read
    env:
      LANG: en_US.UTF-8
    steps: &apple-native-steps
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require native Apple Silicon host
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-apple
        with:
          hosted-xcode-version: ${{ matrix.slug == 'ios' && '27.1' || '26.5' }}
          require-duo-sdk: ${{ matrix.slug == 'ios' && 'true' || 'false' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Ensure CMake for the embedded Steam receiver
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v git-lfs >/dev/null || brew install git-lfs
          command -v gtimeout >/dev/null || brew install coreutils
          cmake --version
      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" --bindir "$RUNNER_TEMP/cocoapods-bin"
          gem_path="$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          { echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"; echo "GEM_PATH=$gem_path"; } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"
          export GEM_HOME="$RUNNER_TEMP/cocoapods-gems" GEM_PATH="$gem_path"
          export PATH="$RUNNER_TEMP/cocoapods-bin:/opt/homebrew/bin:$PATH"
          pod --version
      - name: Qualify Apple native components
        id: qualify-apple-native
        uses: ./.github/actions/apple-native-reliability
        timeout-minutes: 110
        with:
          platform: ${{ matrix.platform }}
          motion-test-only: ${{ inputs.action == 'ios-motion' }}
          defer-older-iphone-smoke: ${{ inputs.action != 'ios-motion' && matrix.slug == 'ios' && runner.environment == 'github-hosted' && 'true' || 'false' }}
        env:
          PUB_CACHE: ${{ runner.temp }}/apple-native-pub-${{ matrix.slug }}

  apple-native-ios-suite:
    name: Apple native reliability (${{ matrix.platform }})
    if: ${{ inputs.action != 'ios-motion' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.execution_profile != 'hybrid' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            slug: ios
    runs-on: ${{ inputs.apple_runner_pool == 'private' && github.event_name == 'workflow_dispatch' && github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main' && github.workflow_ref == 'snapetech-org/pleazyng/.github/workflows/build.yml@refs/heads/main' && fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","ng-shared-main-pleazyng","ng-main-run-{0}","gha-{0}-apple-native-test-{1}"]}}', github.run_id, matrix.slug)) || (matrix.slug == 'ios' && 'xcode-27' || 'macos-26') }}
    permissions:
      contents: read
    env:
      LANG: en_US.UTF-8
    outputs:
      ios-compatibility-artifact-id: ${{ steps.qualify-apple-native.outputs.ios-compatibility-artifact-id }}
    steps: *apple-native-steps

  apple-native-ios-compatibility:
    name: iOS compatibility launch
    if: ${{ inputs.action != 'ios-motion' && needs.apple-native-ios-suite.outputs.ios-compatibility-artifact-id != '' }}
    needs: apple-native-ios-suite
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the iOS checkpoint producer
        id: ios-producer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/apple/verify_ios_compatibility_checkpoint.py producer \
            --run-id "$WORKFLOW_RUN_ID" \
            --run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --job-name 'Apple native reliability (iOS)' \
            --job-name 'Release CI / Apple native reliability (iOS)' \
            --workflow-sha "$PRODUCT_SOURCE_SHA"

      - name: Download candidate iOS app artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ios-compatibility-app-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-ios-app

      - name: Verify frozen candidate source
        id: verify-candidate
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/candidate-ios-app
          PRODUCT_SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_PRODUCER_ATTEMPT: ${{ steps.ios-producer.outputs.attempt }}
        run: |
          set -euo pipefail
          python3 scripts/apple/verify_ios_compatibility_checkpoint.py checkpoint \
            --artifact-dir "$ARTIFACT_DIR" \
            --source-sha "$PRODUCT_SOURCE_SHA" \
            --run-id "$WORKFLOW_RUN_ID" \
            --producer-attempt "$WORKFLOW_PRODUCER_ATTEMPT"

      - name: Require preinstalled iOS 26.5 compatibility runtime
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = arm64
          selected_developer=''
          for developer in \
            /Applications/Xcode_26.5.app/Contents/Developer \
            /Applications/Xcode_26.6.app/Contents/Developer; do
            [[ -d "$developer" ]] || continue
            if DEVELOPER_DIR="$developer" xcrun simctl list -j | python3 -c '
          import json, sys
          inventory = json.load(sys.stdin)
          sys.exit(0 if any(runtime.get("isAvailable") is True
                            and runtime.get("version") == "26.5"
                            and ".iOS-" in runtime.get("identifier", "")
                            for runtime in inventory.get("runtimes", [])) else 1)
          '; then
              selected_developer="$developer"
              break
            fi
          done
          [[ -n "$selected_developer" ]] || {
            echo 'The macos-26 runner must provide a preinstalled iOS 26.5 simulator runtime.' >&2
            exit 1
          }
          echo "DEVELOPER_DIR=$selected_developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$selected_developer" xcodebuild -version

      - name: Extract candidate iOS app
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/candidate-ios-app
          PRODUCTS: ${{ runner.temp }}/candidate-ios-products
          APP_NAME: ${{ steps.verify-candidate.outputs.app_name }}
        run: |
          set -euo pipefail
          mkdir -p "$PRODUCTS"
          ditto -x -k "$ARTIFACT_DIR/ios-simulator-app.zip" "$PRODUCTS"
          test -d "$PRODUCTS/$APP_NAME/Frameworks/App.framework"

      - name: Qualify Apple native components
        shell: bash
        env:
          PRODUCTS: ${{ runner.temp }}/candidate-ios-products
        run: |
          set -euo pipefail
          python3 scripts/apple/smoke_older_iphone.py "$PRODUCTS" --require-installed-runtime

  ios-motion:
    name: iPhone live motion
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'ios-motion' }}
    runs-on: xcode-27
    timeout-minutes: 130
    permissions:
      contents: read
    env:
      LANG: en_US.UTF-8
    strategy:
      matrix:
        include:
          - platform: iOS
            slug: ios
    steps: *apple-native-steps

  apple-native-test:
    name: Apple native reliability
    if: ${{ inputs.action != 'ios-motion' && (always() && !cancelled()) }}
    needs:
      - apple-native-suite
      - apple-native-ios-suite
      - apple-native-ios-compatibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require all Apple native suites
        env:
          SUITE_RESULT: ${{ needs.apple-native-suite.result }}
          IOS_SUITE_RESULT: ${{ needs.apple-native-ios-suite.result }}
          IOS_COMPATIBILITY_RESULT: ${{ needs.apple-native-ios-compatibility.result }}
          IOS_COMPATIBILITY_ARTIFACT_ID: ${{ needs.apple-native-ios-suite.outputs.ios-compatibility-artifact-id }}
        run: |
          set -euo pipefail
          test "$SUITE_RESULT" = success
          test "$IOS_SUITE_RESULT" = success
          if [[ -n "$IOS_COMPATIBILITY_ARTIFACT_ID" ]]; then
            test "$IOS_COMPATIBILITY_RESULT" = success
          else
            test "$IOS_COMPATIBILITY_RESULT" = skipped
          fi

  windows-native-test:
    name: Windows native reliability (${{ matrix.arch }})
    if: ${{ inputs.action != 'ios-motion' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.execution_profile != 'hybrid' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    timeout-minutes: 100
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-vs2026-arm' || 'windows-2025' }}
    env:
      PLEZYNG_ALLOW_DIRECT_DOWNLOADS: ${{ inputs.execution_profile == 'hybrid' && '1' || '0' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            flutter_setup: action
          - arch: arm64
            flutter_setup: git
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Provision and verify pinned Windows build tools
        shell: pwsh
        run: |
          .\windows\tool\prepare-build-toolchain.ps1
          .\windows\tool\prepare-build-toolchain.ps1 -VerifyOnly

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "21"
          architecture: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x64' }}

      - name: Verify provisioned ARM64 7-Zip
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $sevenZip = Get-Command 7z -CommandType Application -ErrorAction Stop
          & $sevenZip.Source i
          if ($LASTEXITCODE -ne 0) { throw 'The public Windows runner 7-Zip is not usable' }

      - name: Load pinned Flutter SDK
        shell: pwsh
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        id: setup_flutter_windows
        if: matrix.flutter_setup == 'action'
        uses: ./.github/actions/setup-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Set up Flutter from its pinned commit
        if: matrix.flutter_setup == 'git'
        uses: ./.github/actions/setup-flutter-git

      - name: Select Visual Studio 2026 generator for hybrid ARM64
        if: inputs.execution_profile == 'hybrid' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          'CMAKE_GENERATOR=Visual Studio 18 2026' >> $env:GITHUB_ENV

      - name: Install locked Dart dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile --no-example

      - name: Build the pinned Whisper ARM64 backend with Clang
        if: inputs.execution_profile == 'hybrid' && matrix.arch == 'arm64'
        shell: pwsh
        run: python scripts/prepare_windows_arm64_whisper.py

      # Windows replacement semantics (`MoveFileExW` with
      # MOVEFILE_REPLACE_EXISTING) cannot be proven on the POSIX runners, and a
      # memory file system proves nothing about either. The vendored
      # shared_preferences_windows store write is the fix for #1732, so exercise
      # it here, on a real NTFS volume, against the real backend.
      - name: Run the vendored Windows preference store tests
        env:
          no_proxy: localhost,127.0.0.1,::1
        shell: pwsh
        run: flutter test test/services/prefs_store_atomic_write_windows_test.dart

      - name: Install patched Flutter engine
        shell: pwsh
        run: |
          flutter precache --windows
          .\windows\tool\install-patched-engine.ps1

      - name: Download and verify pinned Windows libmpv archive
        shell: pwsh
        env:
          PLEZYNG_WINDOWS_CURL_PATH: ${{ steps.setup_flutter_windows.outputs.windows_curl_path }}
        run: .\windows\tool\download-pinned-mpv.ps1 -Architecture '${{ matrix.arch }}'

      - name: Download and verify pinned Windows simdutf source archive
        shell: pwsh
        run: .\windows\tool\download-pinned-simdutf.ps1

      - name: Download and verify pinned Windows WinSparkle archive
        shell: pwsh
        run: .\windows\tool\download-pinned-winsparkle.ps1

      - name: Download and verify pinned Windows SDL3 archive
        shell: pwsh
        run: .\windows\tool\download-pinned-sdl3.ps1

      - name: Download and verify pinned Windows torrent dependencies
        shell: pwsh
        run: .\windows\tool\download-pinned-torrent-dependencies.ps1

      - name: Build bundled MilkRust for Windows
        shell: pwsh
        run: python scripts/visualizer/build_runtime.py --platform windows --architectures "${{ matrix.arch }}" --output build/visualizer-native

      - name: Prepare Flutter Windows configuration
        shell: pwsh
        run: flutter build windows --debug --config-only --no-pub

      - name: Configure Windows native reliability tests
        shell: pwsh
        run: |
          $buildDir = "build/windows/${{ matrix.arch }}"
          cmake -S windows -B $buildDir `
            -DPLEZY_STEAM_TESTS=ON `
            -DPLEZY_BUILD_MPV_PROPERTY_CONTRACT_TESTS=ON `
            -DPLEZY_BUILD_DISPLAY_RECOVERY_TESTS=ON

      - name: Build Windows native reliability tests
        shell: pwsh
        run: |
          $buildDir = "build/windows/${{ matrix.arch }}"
          cmake --build $buildDir --config Debug --parallel 2 --target `
            pleazyng `
            mpv_property_result_contract_test `
            mpv_player_property_contract_test `
            display_mode_manager_test `
            plezy_windows_platform_test `
            plezy_windows_sink_test `
            plezy_h26x_test `
            plezy_audio_test `
            plezy_pyrowave_test

      - name: Run Windows native reliability tests
        shell: pwsh
        run: |
          $buildDir = "build/windows/${{ matrix.arch }}"
          ctest --test-dir "$buildDir/runner" -C Debug --output-on-failure --no-tests=error

  dependency-check:
    name: Dependency Validation
    if: ${{ inputs.action != 'ios-motion' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.execution_profile != 'hybrid' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject tracked package build output
        run: python3 scripts/checks/check_tracked_build_outputs.py
      - name: Check relative Dart imports
        run: python3 scripts/checks/check_dart_imports.py
      - name: Check visualizer process and lifetime contracts
        timeout-minutes: 5
        run: bash scripts/visualizer/test_native.sh

      - name: Validate published release facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/checks/check_capability_manifest.py --live

      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-v3-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Verify dependencies
        run: |
          flutter clean
          flutter pub get --enforce-lockfile
          flutter pub outdated

  server:
    name: Server checks
    if: ${{ inputs.action != 'ios-motion' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (inputs.execution_profile != 'hybrid' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run server checks
        run: scripts/ci_server_checks.sh


  # The only job that checks packaging against a real artifact. build.yml also
  # packages Linux, but refuses any ref but refs/heads/main, and
  # check_linux_package_deps.py can only compare a hand-written list against
  # CMake - it cannot prove the list reaches the artifact, nor see the
  # transitive libraries the bundled libmpv drags in. This can, by reading the
  # built bundle back with ldd.
  #
  # Manual-only package smoke build for changes to linux/packaging. Release
  # packages are built by build.yml; ordinary pushes run the lightweight CI
  # checks above without packaging release artifacts.
  linux-packages:
    name: Linux package smoke build
    if: ${{ inputs.action != 'ios-motion' && (github.event_name == 'workflow_dispatch' && inputs.build_linux_packages && (inputs.execution_profile != 'hybrid' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    timeout-minutes: 100
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "21"

      # The packaging deps, minus libmpv: that arrives prebuilt from mpv-build
      # below. The dev packages still matter — they install the runtime
      # libraries the pinned libmpv links (ass, pulse, pipewire, ...), which
      # bundle-libs.sh resolves off the host into the bundle.
      - name: Install packaging dependencies
        run: |
          sudo python3 scripts/configure_hosted_apt.py '${{ runner.environment }}'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake meson ninja-build pkg-config nasm libgtk-3-dev libwebkit2gtk-4.1-dev libsecret-1-dev liblzma-dev \
            libstdc++-12-dev libepoxy-dev libcurl4-openssl-dev libevdev-dev \
            libasound2-dev libass-dev libfreetype-dev libfontconfig-dev libfribidi-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            libharfbuzz-dev libegl-dev libgl-dev libgnutls28-dev libpipewire-0.3-dev \
            libva-dev libvdpau1 libvulkan1 libxkbcommon-dev libpulse-dev libdbus-1-dev libdrm-dev \
            libdisplay-info-dev libgbm-dev libwayland-dev wayland-protocols liblcms2-dev libmujs-dev \
            liblua5.2-dev rpm libarchive-tools imagemagick ruby-dev build-essential
          proxy="${HTTPS_PROXY:-${https_proxy:-}}"
          if [[ -n "$proxy" ]]; then
            sudo env \
              HTTP_PROXY="${HTTP_PROXY:-$proxy}" \
              HTTPS_PROXY="$proxy" \
              http_proxy="${http_proxy:-${HTTP_PROXY:-$proxy}}" \
              https_proxy="${https_proxy:-$proxy}" \
              gem install fpm --version 1.17.0 --no-document
          else
            sudo gem install fpm --version 1.17.0 --no-document
          fi
        env:
          EXECUTION_PROFILE_INPUT: ${{ inputs.execution_profile }}

      # Keyed the same way build.yml keys it: the lock names the asset and its
      # checksum, so editing the lock is what invalidates the cache.
      - name: Cache libmpv prefix
        id: libmpv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: libmpv-prefix
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-libmpv-${{ runner.arch }}-${{ hashFiles('mpv-build.lock.json', 'scripts/fetch_linux_libmpv.py') }}

      # Same contract as build.yml: the script reads mpv-build.lock.json,
      # downloads the linux asset for this arch, verifies its SHA-256, and
      # extracts the prefix tree.
      - name: Fetch libmpv
        env:
          GH_TOKEN: ${{ github.token }}
        if: steps.libmpv-cache.outputs.cache-hit != 'true'
        run: |
          command -v zstd >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd; }
          python3 scripts/fetch_linux_libmpv.py --dest libmpv-prefix

      # The windowing backends the runner depends on, read off the pinned
      # library just extracted. The plane hands mpv MPV_RENDER_PARAM_WL_DISPLAY,
      # so a libmpv without Wayland cannot find the VAAPI device and quietly
      # decodes in software; X11 and VDPAU are gone with the texture path.
      - name: Check the pinned libmpv's backends
        run: |
          LIB=$(find libmpv-prefix -name 'libmpv.so.2' | head -1)
          echo "== $LIB =="
          ldd "$LIB" | grep -iE 'wayland|libX11|vdpau' || echo '(none)'
          ldd "$LIB" | grep -q libwayland-client || {
            echo "::error::the built libmpv does not link libwayland-client, so the video plane cannot work"
            exit 1
          }

      - name: Build bundled MilkRust for Linux
        shell: bash
        run: python3 scripts/visualizer/build_runtime.py --platform linux --architectures "x64" --output build/visualizer-native

      - name: Build the release bundle
        run: |
          flutter pub get --enforce-lockfile --no-example
          flutter build linux --release
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/libmpv-prefix/lib/pkgconfig:${{ github.workspace }}/libmpv-prefix/lib/x86_64-linux-gnu/pkgconfig

      - name: Install and verify locked Sherpa ONNX libraries
        shell: bash
        run: python3 linux/packaging/install-sherpa-onnx-runtime.py build/linux/x64/release/bundle --arch x64

      # Mirrors build.yml: resolve the bundle completely, then package from it.
      # libmpv travels with us, so nothing depends on a host one - which also
      # removes the transitive pull of everything libmpv links, hence bundle-libs
      # before packaging rather than after.
      - name: Copy libmpv into the bundle
        run: |
          BUNDLE_LIB=build/linux/x64/release/bundle/lib
          LIBMPV_DIR=$(dirname "$(find libmpv-prefix -name 'libmpv.so' | head -1)")
          cp -a "$LIBMPV_DIR"/libmpv.so* "$BUNDLE_LIB/"
          cp -a libmpv-prefix/lib/libshaderc_shared.so* "$BUNDLE_LIB/"
          cp -a libmpv-prefix/lib/libvulkan.so* "$BUNDLE_LIB/"

      - name: Verify native visualizer and music PCM in Linux bundle
        run: python3 scripts/visualizer/check_linux_bundle.py build/linux/x64/release/bundle

      - name: Bundle shared libraries
        run: bash linux/packaging/bundle-libs.sh build/linux/x64/release/bundle

      - name: Copy wrapper script into the bundle
        run: bash linux/packaging/prepare-bundle-launcher.sh build/linux/x64/release/bundle

      # Derives what the resolved bundle still needs from the host and proves
      # every one of those libraries is declared. This is the check that would
      # have caught bundling libmpv without also declaring what libmpv links.
      - name: Verify every unbundled library the bundle needs is declared
        run: python3 linux/packaging/check-bundle-host-deps.py build/linux/x64/release/bundle

      # OUTPUT_DIR defaults to the repo root; name it so the paths below are not
      # a guess about where fpm dropped things. The host-dependency guard is
      # skipped because the named step above just ran it against this same
      # bundle; the internal run exists for by-hand packaging outside CI.
      - name: Build the packages
        run: |
          mkdir -p "$OUTPUT_DIR"
          python3 linux/packaging/build-packages.py
        env:
          OUTPUT_DIR: ${{ github.workspace }}/packages
          PLEZY_SKIP_HOST_DEP_CHECK: "1"

      # The guard above reconciles the depends lists with the staged bundle; only
      # the packages themselves can show that list survived fpm. Every name comes
      # from build-packages.py, so adding a library there is verified here without
      # a second edit - and this job is off by default, so a hand-copied list
      # would rot unseen. The release job in build.yml runs the same script
      # against the artifacts users install, so the assertions cannot drift.
      - name: Verify the declared dependencies reached the package metadata
        run: python3 linux/packaging/check-package-deps.py "${{ github.workspace }}/packages"

      # Same resolved bundle the packages were cut from, so the tarball is not a
      # second, differently-assembled artifact. It is the one to put on a USB for
      # a foreign machine, because it needs nothing installed.
      - name: Create the tarball
        run: |
          BUNDLE_DIR=build/linux/x64/release/bundle
          mkdir -p "$OUTPUT_DIR"
          tar -czf "$OUTPUT_DIR/pleazyng-linux-x64.tar.gz" -C "$BUNDLE_DIR" .
          echo "=== libmpv travelling in every artifact ==="
          ldd "$BUNDLE_DIR/lib/libmpv.so" | grep -iE 'wayland|libX11|vdpau' || echo '(none)'
        env:
          OUTPUT_DIR: ${{ github.workspace }}/packages

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-packages-smoke
          path: ${{ github.workspace }}/packages/pleazyng-linux-x64.*
          if-no-files-found: error
          retention-days: 7

  appimage-update-smoke:
    name: AppImage update contract
    if: ${{ inputs.action != 'ios-motion' && (inputs.execution_profile == 'hybrid' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install AppImage build tools
        run: |
          # Hosted Ubuntu's Azure mirror can retry for longer than this smoke
          # job's deadline. The public archive is the runner's working fallback.
          if test -f /etc/apt/apt-mirrors.txt; then
            printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends zsync binutils
      - name: Build and verify a fixture with the release packager
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/appimage-update-fixture"
          mkdir -p "$fixture/bundle" "$fixture/output"
          printf '#!/bin/sh\nexit 0\n' > "$fixture/bundle/pleazyng.sh"
          chmod +x "$fixture/bundle/pleazyng.sh"
          bash scripts/build_appimage.sh "$fixture/bundle" "$fixture/output" qa "$GITHUB_REPOSITORY"
          python3 scripts/create_release_checksums.py "$fixture/output"
          (cd "$fixture/output" && sha256sum --check SHA256SUMS.txt)
