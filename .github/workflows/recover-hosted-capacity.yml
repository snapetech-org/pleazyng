name: Recover hosted runner capacity
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: Check one failed run, or leave blank to scan recent runs
        type: string

concurrency:
  group: pleazyng-hosted-capacity-recovery
  cancel-in-progress: false

permissions: {}

jobs:
  recover:
    if: github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Retry confirmed hosted runner failures
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [[ -n "$RUN_ID" ]]; then
            python3 scripts/recover_hosted_capacity.py --retry -- "$RUN_ID"
          else
            python3 scripts/recover_hosted_capacity.py --recent --retry
          fi
