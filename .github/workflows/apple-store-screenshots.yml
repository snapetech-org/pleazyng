# ng-runner-policy: hosted-default-v2
# Store screenshots are captured from real app builds on public hosted Macs.
name: Apple Store Screenshots
run-name: apple-store-screenshots:${{ inputs.product_version || '3.0.37' }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Capture all Apple platforms or only a named lane.
        type: choice
        options:
          - all
          - ios-macos-only
          - macos-only
          - capture-only
          - macos-paywall-capture-only
          - app-in-use-capture-only
          - ios-in-use-capture-only
          - ipad-in-use-capture-only
          - ipad-listing-producer-only
          - macos-in-use-capture-only
          - macos-listing-capture-only
          - macos-in-use-diagnostic-only
          - tvos-listing-only
          - tvos-in-use-capture-only
          - tvos-in-use-producer-only
          - macos-tvos-in-use-producer-only
        default: all
        required: true
      artifact_run_id:
        description: Completed main-branch run supplying partial captures or the required compiled app bundle(s).
        type: string
        required: false
      ios_artifact_run_id:
        description: Completed run supplying the verified iOS app bundle for app-in-use capture.
        type: string
        required: false
      macos_artifact_run_id:
        description: Completed run supplying the verified macOS app bundle for app-in-use capture.
        type: string
        required: false
      macos_artifact_run_attempt:
        description: Exact completed producer attempt for the selected macOS app artifact when a run has targeted retries.
        type: string
        required: false
      tvos_artifact_run_id:
        description: Completed run supplying the verified tvOS app bundle for app-in-use capture.
        type: string
        required: false
      product_source_tag:
        description: Exact annotated candidate tag for the selected product source.
        type: string
        required: false
      product_source_sha:
        description: Full commit SHA resolved by product_source_tag.
        type: string
        required: false
      product_version:
        description: Product semantic version from the selected source checkout.
        type: string
        required: false
      product_build:
        description: Numeric product build from the selected source checkout.
        type: string
        required: false
      frozen_product_source_sha:
        description: Optional exact frozen product SHA when this producer builds an approved packaging repair.
        type: string
        required: false
      frozen_product_source_tag:
        description: Optional annotated candidate tag for frozen_product_source_sha.
        type: string
        required: false

permissions:
  actions: read
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  PUB_CACHE: ${{ github.workspace }}/.cache/plezy-pub-cache
  PLEAZYNG_CAPTURE_PRODUCT_SOURCE_SHA: ${{ inputs.product_source_sha || '28f417ab17a4b6dc4c2e422b27662c62f62be7fb' }}
  PLEAZYNG_CAPTURE_PRODUCT_SOURCE_TAG: ${{ inputs.product_source_tag || 'v3.0.37-candidate.28f417ab17a4b6dc4c2e422b27662c62f62be7fb' }}
  PLEAZYNG_CAPTURE_PRODUCT_VERSION: ${{ inputs.product_version || '3.0.37' }}
  PLEAZYNG_CAPTURE_PRODUCT_BUILD: ${{ inputs.product_build || '196' }}
  PLEAZYNG_CAPTURE_FROZEN_PRODUCT_SOURCE_SHA: ${{ inputs.frozen_product_source_sha }}
  PLEAZYNG_CAPTURE_FROZEN_PRODUCT_SOURCE_TAG: ${{ inputs.frozen_product_source_tag }}
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  DASH__SUPPRESS_ANALYTICS: "true"

jobs:
  ios:
    if: github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'ios-macos-only' || inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only' || inputs.target == 'ipad-in-use-capture-only' || inputs.target == 'ipad-listing-producer-only' || inputs.target == '')
    concurrency:
      group: pleazyng-apple-store-screenshots-ios
      cancel-in-progress: false
      queue: max
    runs-on: ${{ (inputs.target == 'ipad-in-use-capture-only' || inputs.target == 'ipad-listing-producer-only') && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.product_source_tag || 'v3.0.37-candidate.28f417ab17a4b6dc4c2e422b27662c62f62be7fb' }}
          fetch-depth: ${{ inputs.frozen_product_source_sha != '' && 2 || 1 }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: capture-tools
          persist-credentials: false

      - name: Verify the exact product source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.product_source_sha || '28f417ab17a4b6dc4c2e422b27662c62f62be7fb' }}
          EXPECTED_SOURCE_TAG: ${{ inputs.product_source_tag || 'v3.0.37-candidate.28f417ab17a4b6dc4c2e422b27662c62f62be7fb' }}
          EXPECTED_VERSION: ${{ inputs.product_version || '3.0.37' }}
          EXPECTED_BUILD: ${{ inputs.product_build || '196' }}
          DYNAMIC_SOURCE_REQUIRED: ${{ inputs.product_source_tag != '' || inputs.product_source_sha != '' || inputs.product_version != '' || inputs.product_build != '' || inputs.frozen_product_source_sha != '' || inputs.frozen_product_source_tag != '' }}
          FROZEN_PRODUCT_SOURCE_SHA: ${{ inputs.frozen_product_source_sha }}
          FROZEN_PRODUCT_SOURCE_TAG: ${{ inputs.frozen_product_source_tag }}
          INPUT_PRODUCT_SOURCE_SHA: ${{ inputs.product_source_sha }}
          INPUT_PRODUCT_SOURCE_TAG: ${{ inputs.product_source_tag }}
          INPUT_PRODUCT_VERSION: ${{ inputs.product_version }}
          INPUT_PRODUCT_BUILD: ${{ inputs.product_build }}
        run: |
          set -euo pipefail
          if [[ "$DYNAMIC_SOURCE_REQUIRED" == true ]]; then
            [[ -n "$INPUT_PRODUCT_SOURCE_SHA" && -n "$INPUT_PRODUCT_SOURCE_TAG" ]]
            [[ -n "$INPUT_PRODUCT_VERSION" && -n "$INPUT_PRODUCT_BUILD" ]]
            [[ "$EXPECTED_SOURCE_SHA" == "$INPUT_PRODUCT_SOURCE_SHA" ]]
            [[ "$EXPECTED_SOURCE_TAG" == "$INPUT_PRODUCT_SOURCE_TAG" ]]
            [[ "$EXPECTED_VERSION" == "$INPUT_PRODUCT_VERSION" ]]
            [[ "$EXPECTED_BUILD" == "$INPUT_PRODUCT_BUILD" ]]
            [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EXPECTED_SOURCE_TAG" == "v$EXPECTED_VERSION-candidate.$EXPECTED_SOURCE_SHA" ]]
            [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$EXPECTED_BUILD" =~ ^[0-9]+$ ]]
            if [[ -n "$FROZEN_PRODUCT_SOURCE_SHA" || -n "$FROZEN_PRODUCT_SOURCE_TAG" ]]; then
              [[ "$FROZEN_PRODUCT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$FROZEN_PRODUCT_SOURCE_TAG" == "v$EXPECTED_VERSION-candidate.$FROZEN_PRODUCT_SOURCE_SHA" ]]
              git fetch --no-tags origin "refs/tags/$FROZEN_PRODUCT_SOURCE_TAG:refs/tags/$FROZEN_PRODUCT_SOURCE_TAG"
            fi
          fi
          test "$(git cat-file -t "refs/tags/$EXPECTED_SOURCE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$EXPECTED_SOURCE_TAG^{commit}")" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_SOURCE_SHA...$GITHUB_SHA" --jq .merge_base_commit.sha)"
          test "$merge_base" = "$EXPECTED_SOURCE_SHA"
          test "$(python3 scripts/pubspec_version.py)" = "$EXPECTED_VERSION+$EXPECTED_BUILD"

      - name: Verify the prior build artifact producer
        id: producer
        if: inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only' || inputs.target == 'ipad-in-use-capture-only'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only' || inputs.target == 'ipad-in-use-capture-only') && inputs.ios_artifact_run_id || inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RUN_ID" =~ ^[0-9]+$ ]]
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/apple-store-screenshots.yml" --jq .id)"
          [[ "$workflow_id" =~ ^[0-9]+$ ]]
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" \
            --jq "if .workflow_id == $workflow_id and .event == \"workflow_dispatch\" and .head_branch == \"main\" and .status == \"completed\" then [.head_sha, (.run_attempt | tostring)] | @tsv else error(\"build producer is not a completed main-branch Apple Store Screenshots dispatch\") end")"
          IFS=$'\t' read -r tool_sha run_attempt <<< "$metadata"
          [[ "$tool_sha" =~ ^[0-9a-f]{40}$ && "$run_attempt" =~ ^[0-9]+$ ]]
          echo "tool_sha=$tool_sha" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"

      - name: Download prior iOS build
        if: inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only' || inputs.target == 'ipad-in-use-capture-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-store-build-ios-${{ inputs.product_version || '3.0.37' }}
          run-id: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only' || inputs.target == 'ipad-in-use-capture-only') && inputs.ios_artifact_run_id || inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apple-store-build-ios-input

      - name: Validate and restore prior iOS build
        if: inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only' || inputs.target == 'ipad-in-use-capture-only'
        env:
          PRODUCER_RUN_ID: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only' || inputs.target == 'ipad-in-use-capture-only') && inputs.ios_artifact_run_id || inputs.artifact_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.run_attempt }}
          PRODUCER_TOOLS_SHA: ${{ steps.producer.outputs.tool_sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py restore-build \
            --product-root "$GITHUB_WORKSPACE" \
            --artifact-dir "$RUNNER_TEMP/apple-store-build-ios-input" \
            --platform ios \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --expected-capture-tools-sha "$PRODUCER_TOOLS_SHA" \
            --output-dir "$RUNNER_TEMP/apple-store-build-ios-restored"
          echo "APPLE_STORE_APP_PATH=$RUNNER_TEMP/apple-store-build-ios-restored/Pleazyng.app" >> "$GITHUB_ENV"
          echo "APPLE_STORE_BUILD_RECEIPT=$RUNNER_TEMP/apple-store-build-ios-restored/build-provenance.json" >> "$GITHUB_ENV"

      - name: Select supported Xcode and iOS SDK for retained-app capture
        if: inputs.target == 'ipad-in-use-capture-only'
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          [[ "$(xcodebuild -version | sed -n '1p')" == 'Xcode 27.2' ]]
          [[ "$(xcrun --sdk iphonesimulator --show-sdk-version)" == '27.2' ]]
          python3 - <<'PY'
          import json
          import subprocess

          inventory = json.loads(subprocess.run(
              ["xcrun", "simctl", "list", "-j"], check=True, text=True, capture_output=True
          ).stdout)
          runtimes = [runtime for runtime in inventory.get("runtimes", [])
                      if runtime.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
                      and runtime.get("version") == "27.2" and runtime.get("isAvailable") is True]
          if not runtimes:
              raise SystemExit("Xcode 27.2 has no available iOS 27.2 Simulator runtime")
          print(json.dumps(runtimes, indent=2))
          PY

      - name: Install the UI capture project generator
        if: inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only' || inputs.target == 'ipad-in-use-capture-only' || inputs.target == 'ipad-listing-producer-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v xcodegen >/dev/null || brew install xcodegen
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Load pinned Flutter SDK
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only'
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only'
        uses: ./.github/actions/setup-flutter-apple
        with:
          hosted-xcode-version: ${{ inputs.target == 'ipad-listing-producer-only' && '27.1' || '26.5' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub dependencies
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PUB_CACHE }}
          key: apple-store-v${{ inputs.product_version || '3.0.37' }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Install native build tools
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v git-lfs >/dev/null || brew install git-lfs

      - name: Install CocoaPods
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" \
            --bindir "$RUNNER_TEMP/cocoapods-bin"
          {
            echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"
            echo "GEM_PATH=$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"

      - name: Install locked Flutter dependencies
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only'
        run: flutter pub get --enforce-lockfile --no-example

      - name: Prefetch checksum-pinned iOS native downloads
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only'
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform ios

      - name: Prepare pinned iOS Steam sources
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only'
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: python3 scripts/games/prepare_steam.py

      - name: Resolve pinned iOS Swift packages
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only'
        env:
          PLEAZYNG_APPLE_SOURCE_ROOT: ${{ github.workspace }}
        run: capture-tools/scripts/refresh_apple_spm.sh ios

      - name: Build the Store-mode iOS Simulator app
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only'
        env:
          SOURCE_SHA: ${{ inputs.product_source_sha || '28f417ab17a4b6dc4c2e422b27662c62f62be7fb' }}
        run: |
          set -euo pipefail
          flutter build ios --debug --simulator --no-codesign --no-pub \
            --dart-define=SUPPORTER_MODE=iap \
            --dart-define=ENABLE_UPDATE_CHECK=false \
            --dart-define=GIT_COMMIT="$SOURCE_SHA" \
            --dart-define=PLEAZYNG_DISCORD_APPLICATION_ID=
          test -d build/ios/iphonesimulator/Pleazyng.app

      - name: Preserve the compiled iOS Simulator app before capture
        id: preserve-build
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py preserve-build \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$GITHUB_WORKSPACE/build/ios/iphonesimulator/Pleazyng.app" \
            --platform ios \
            --source-lineage-root "$GITHUB_WORKSPACE/capture-tools" \
            --output-dir "$RUNNER_TEMP/apple-store-build-ios"
          echo "APPLE_STORE_APP_PATH=$GITHUB_WORKSPACE/build/ios/iphonesimulator/Pleazyng.app" >> "$GITHUB_ENV"
          echo "APPLE_STORE_BUILD_RECEIPT=$RUNNER_TEMP/apple-store-build-ios/build-provenance.json" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only'
        with:
          name: apple-store-build-ios-${{ inputs.product_version || '3.0.37' }}
          path: |
            ${{ runner.temp }}/apple-store-build-ios/build-provenance.json
            ${{ runner.temp }}/apple-store-build-ios/pleazyng-apple-store-build-ios.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Capture actual iPhone and iPad app screens
        if: inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only' && inputs.target != 'ipad-listing-producer-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py capture-ios \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$APPLE_STORE_APP_PATH" \
            --output-dir "$RUNNER_TEMP/apple-store-captures-ios"

      - name: Capture post-onboarding iPhone and iPad Files and Books screens
        if: inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only' || inputs.target == 'ipad-in-use-capture-only' || inputs.target == 'ipad-listing-producer-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
          PLEAZYNG_CAPTURE_IPAD_LOCALTEST_TRIAL: ${{ inputs.target == 'ipad-in-use-capture-only' && 'true' || 'false' }}
        run: |
          set -eo pipefail
          localtest_args=()
          if [[ "$PLEAZYNG_CAPTURE_IPAD_LOCALTEST_TRIAL" == 'true' ]]; then
            localtest_args+=(--localtest-trial)
          fi
          python3 capture-tools/scripts/capture_apple_store_screenshots.py capture-ios-in-use \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$APPLE_STORE_APP_PATH" \
            --build-receipt "$APPLE_STORE_BUILD_RECEIPT" \
            --simulator-entitlements "$GITHUB_WORKSPACE/capture-tools/ios/Runner/DebugProfile.entitlements" \
            --extension-entitlements "$GITHUB_WORKSPACE/native/games/romm/apple/extension/RommWorker.entitlements" \
            --device-category "${{ (inputs.target == 'ipad-in-use-capture-only' || inputs.target == 'ipad-listing-producer-only') && 'ipad' || 'both' }}" \
            "${localtest_args[@]}" \
            --output-dir "$RUNNER_TEMP/apple-store-in-use-captures-ios"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only' && inputs.target != 'ipad-in-use-capture-only' && inputs.target != 'ipad-listing-producer-only'
        with:
          name: apple-store-captures-ios-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-captures-ios/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && (inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only' || inputs.target == 'ipad-in-use-capture-only' || inputs.target == 'ipad-listing-producer-only')
        with:
          name: apple-store-in-use-captures-ios-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-in-use-captures-ios/
          if-no-files-found: warn
          retention-days: 7

  tvos:
    if: github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-listing-only' || inputs.target == 'tvos-in-use-capture-only' || inputs.target == 'tvos-in-use-producer-only' || inputs.target == 'macos-tvos-in-use-producer-only' || inputs.target == '')
    concurrency:
      group: pleazyng-apple-store-screenshots-tvos
      cancel-in-progress: false
      queue: max
    runs-on: ${{ (inputs.target == 'tvos-in-use-capture-only' || inputs.target == 'tvos-in-use-producer-only') && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.product_source_tag || 'v3.0.37-candidate.28f417ab17a4b6dc4c2e422b27662c62f62be7fb' }}
          fetch-depth: ${{ inputs.frozen_product_source_sha != '' && 2 || 1 }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: capture-tools
          persist-credentials: false

      - name: Verify the exact product source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.product_source_sha || '28f417ab17a4b6dc4c2e422b27662c62f62be7fb' }}
          EXPECTED_SOURCE_TAG: ${{ inputs.product_source_tag || 'v3.0.37-candidate.28f417ab17a4b6dc4c2e422b27662c62f62be7fb' }}
          EXPECTED_VERSION: ${{ inputs.product_version || '3.0.37' }}
          EXPECTED_BUILD: ${{ inputs.product_build || '196' }}
          DYNAMIC_SOURCE_REQUIRED: ${{ inputs.target == 'tvos-in-use-producer-only' || inputs.product_source_tag != '' || inputs.product_source_sha != '' || inputs.product_version != '' || inputs.product_build != '' || inputs.frozen_product_source_sha != '' || inputs.frozen_product_source_tag != '' }}
          FROZEN_PRODUCT_SOURCE_SHA: ${{ inputs.frozen_product_source_sha }}
          FROZEN_PRODUCT_SOURCE_TAG: ${{ inputs.frozen_product_source_tag }}
          INPUT_PRODUCT_SOURCE_SHA: ${{ inputs.product_source_sha }}
          INPUT_PRODUCT_SOURCE_TAG: ${{ inputs.product_source_tag }}
          INPUT_PRODUCT_VERSION: ${{ inputs.product_version }}
          INPUT_PRODUCT_BUILD: ${{ inputs.product_build }}
        run: |
          set -euo pipefail
          if [[ "$DYNAMIC_SOURCE_REQUIRED" == true ]]; then
            [[ -n "$INPUT_PRODUCT_SOURCE_SHA" && -n "$INPUT_PRODUCT_SOURCE_TAG" ]]
            [[ -n "$INPUT_PRODUCT_VERSION" && -n "$INPUT_PRODUCT_BUILD" ]]
            [[ "$EXPECTED_SOURCE_SHA" == "$INPUT_PRODUCT_SOURCE_SHA" ]]
            [[ "$EXPECTED_SOURCE_TAG" == "$INPUT_PRODUCT_SOURCE_TAG" ]]
            [[ "$EXPECTED_VERSION" == "$INPUT_PRODUCT_VERSION" ]]
            [[ "$EXPECTED_BUILD" == "$INPUT_PRODUCT_BUILD" ]]
            [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EXPECTED_SOURCE_TAG" == "v$EXPECTED_VERSION-candidate.$EXPECTED_SOURCE_SHA" ]]
            [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$EXPECTED_BUILD" =~ ^[0-9]+$ ]]
            if [[ -n "$FROZEN_PRODUCT_SOURCE_SHA" || -n "$FROZEN_PRODUCT_SOURCE_TAG" ]]; then
              [[ "$FROZEN_PRODUCT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$FROZEN_PRODUCT_SOURCE_TAG" == "v$EXPECTED_VERSION-candidate.$FROZEN_PRODUCT_SOURCE_SHA" ]]
              git fetch --no-tags origin "refs/tags/$FROZEN_PRODUCT_SOURCE_TAG:refs/tags/$FROZEN_PRODUCT_SOURCE_TAG"
            fi
          fi
          test "$(git cat-file -t "refs/tags/$EXPECTED_SOURCE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$EXPECTED_SOURCE_TAG^{commit}")" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_SOURCE_SHA...$GITHUB_SHA" --jq .merge_base_commit.sha)"
          test "$merge_base" = "$EXPECTED_SOURCE_SHA"
          test "$(python3 scripts/pubspec_version.py)" = "$EXPECTED_VERSION+$EXPECTED_BUILD"

      - name: Verify the prior build artifact producer
        id: producer
        if: inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only') && inputs.tvos_artifact_run_id || inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RUN_ID" =~ ^[0-9]+$ ]]
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/apple-store-screenshots.yml" --jq .id)"
          [[ "$workflow_id" =~ ^[0-9]+$ ]]
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" \
            --jq "if .workflow_id == $workflow_id and .event == \"workflow_dispatch\" and .head_branch == \"main\" and .status == \"completed\" then [.head_sha, (.run_attempt | tostring)] | @tsv else error(\"build producer is not a completed main-branch Apple Store Screenshots dispatch\") end")"
          IFS=$'\t' read -r tool_sha run_attempt <<< "$metadata"
          [[ "$tool_sha" =~ ^[0-9a-f]{40}$ && "$run_attempt" =~ ^[0-9]+$ ]]
          echo "tool_sha=$tool_sha" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"

      - name: Download prior tvOS build
        if: inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-store-build-tvos-${{ inputs.product_version || '3.0.37' }}
          run-id: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only') && inputs.tvos_artifact_run_id || inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apple-store-build-tvos-input

      - name: Validate and restore prior tvOS build
        if: inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only'
        env:
          PRODUCER_RUN_ID: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only') && inputs.tvos_artifact_run_id || inputs.artifact_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.run_attempt }}
          PRODUCER_TOOLS_SHA: ${{ steps.producer.outputs.tool_sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py restore-build \
            --product-root "$GITHUB_WORKSPACE" \
            --artifact-dir "$RUNNER_TEMP/apple-store-build-tvos-input" \
            --platform tvos \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --expected-capture-tools-sha "$PRODUCER_TOOLS_SHA" \
            --output-dir "$RUNNER_TEMP/apple-store-build-tvos-restored"
          echo "APPLE_STORE_APP_PATH=$RUNNER_TEMP/apple-store-build-tvos-restored/Runner.app" >> "$GITHUB_ENV"
          echo "APPLE_STORE_BUILD_RECEIPT=$RUNNER_TEMP/apple-store-build-tvos-restored/build-provenance.json" >> "$GITHUB_ENV"

      - name: Select supported Xcode and tvOS SDK for retained-app capture
        if: inputs.target == 'tvos-in-use-capture-only' || inputs.target == 'tvos-in-use-producer-only'
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          [[ "$(xcodebuild -version | sed -n '1p')" == 'Xcode 27.2' ]]
          [[ "$(xcrun --sdk appletvsimulator --show-sdk-version)" == '27.2' ]]

      - name: Install the UI capture project generator
        if: inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-listing-only' || inputs.target == 'tvos-in-use-capture-only' || inputs.target == 'tvos-in-use-producer-only' || inputs.target == 'macos-tvos-in-use-producer-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v xcodegen >/dev/null || brew install xcodegen
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Setup the pinned tvOS Flutter SDK
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        uses: ./.github/actions/setup-flutter-apple
        with:
          hosted-xcode-version: ${{ inputs.target == 'tvos-in-use-producer-only' && '27.2' || '26.5' }}
          flutter-version: '3.47.1'

      - name: Cache Pub dependencies
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PUB_CACHE }}
          key: apple-store-tvos-v${{ inputs.product_version || '3.0.37' }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock', 'pubspec_overrides_tvos.yaml') }}

      - name: Install native build tools
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v git-lfs >/dev/null || brew install git-lfs

      - name: Install CocoaPods
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" \
            --bindir "$RUNNER_TEMP/cocoapods-bin"
          {
            echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"
            echo "GEM_PATH=$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"

      - name: Resolve tvOS dependencies
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        run: tvos/scripts/pub_get.sh

      - name: Prefetch checksum-pinned tvOS native downloads
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform tvos

      - name: Fetch the checksum-pinned tvOS Flutter engine
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        run: tvos/scripts/fetch_engine.sh

      - name: Install tvOS CocoaPods dependencies
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          askpass="$RUNNER_TEMP/pleazyng-tvos-git-askpass"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*github.com*) printf '%s\n' x-access-token ;;
            *Password*github.com*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          tvos/scripts/pod_install.sh

      - name: Resolve pinned tvOS Swift packages
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        env:
          TVOS_DERIVED_DATA: ${{ runner.temp }}/apple-store-tvos-derived
          TVOS_SOURCE_PACKAGES: ${{ runner.temp }}/apple-store-tvos-source-packages
        run: |
          mkdir -p "$TVOS_DERIVED_DATA" "$TVOS_SOURCE_PACKAGES"
          xcodebuild -resolvePackageDependencies \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -derivedDataPath "$TVOS_DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$TVOS_SOURCE_PACKAGES"
          python3 scripts/patch_amsmb2_manifest.py \
            --source-packages-dir "$TVOS_SOURCE_PACKAGES" \
            --resolved-package tvos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build the Store-mode tvOS Simulator app
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        env:
          TVOS_DERIVED_DATA: ${{ runner.temp }}/apple-store-tvos-derived
          TVOS_SOURCE_PACKAGES: ${{ runner.temp }}/apple-store-tvos-source-packages
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$TVOS_DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$TVOS_SOURCE_PACKAGES" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          test -d "$TVOS_DERIVED_DATA/Build/Products/Debug-appletvsimulator/Runner.app"

      - name: Preserve the compiled tvOS Simulator app before capture
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(
            --product-root "$GITHUB_WORKSPACE" \
            --app "$RUNNER_TEMP/apple-store-tvos-derived/Build/Products/Debug-appletvsimulator/Runner.app" \
            --platform tvos \
            --source-lineage-root "$GITHUB_WORKSPACE/capture-tools" \
            --output-dir "$RUNNER_TEMP/apple-store-build-tvos"
          )
          python3 capture-tools/scripts/capture_apple_store_screenshots.py preserve-build "${args[@]}"
          echo "APPLE_STORE_APP_PATH=$RUNNER_TEMP/apple-store-tvos-derived/Build/Products/Debug-appletvsimulator/Runner.app" >> "$GITHUB_ENV"
          echo "APPLE_STORE_BUILD_RECEIPT=$RUNNER_TEMP/apple-store-build-tvos/build-provenance.json" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        with:
          name: apple-store-build-tvos-${{ inputs.product_version || '3.0.37' }}
          path: |
            ${{ runner.temp }}/apple-store-build-tvos/build-provenance.json
            ${{ runner.temp }}/apple-store-build-tvos/pleazyng-apple-store-build-tvos.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Verify the tvOS Simulator AMSMB2 strong dependency
        if: inputs.target == 'tvos-in-use-producer-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py verify-tvos-simulator-framework \
            --product-root "$GITHUB_WORKSPACE" \
            --source-lineage-root "$GITHUB_WORKSPACE/capture-tools" \
            --app "$APPLE_STORE_APP_PATH" \
            --build-receipt "$APPLE_STORE_BUILD_RECEIPT" \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/tvos-runtime-dependency-receipt.json"

      - name: Retain tvOS runtime dependency report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.target == 'tvos-in-use-producer-only'
        with:
          name: apple-store-tvos-runtime-dependency-report-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/tvos-runtime-dependency-receipt.json
          if-no-files-found: warn
          retention-days: 14

      - name: Capture the actual tvOS app screen
        if: inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-listing-only' && inputs.target != 'tvos-in-use-capture-only' && inputs.target != 'tvos-in-use-producer-only' && inputs.target != 'macos-tvos-in-use-producer-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py capture-tvos \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$APPLE_STORE_APP_PATH" \
            --output-dir "$RUNNER_TEMP/apple-store-captures-tvos"

      - name: Capture the post-onboarding tvOS Files and Books screen
        if: inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-listing-only' || inputs.target == 'macos-tvos-in-use-producer-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py capture-tvos-in-use \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$APPLE_STORE_APP_PATH" \
            --build-receipt "$APPLE_STORE_BUILD_RECEIPT" \
            --output-dir "$RUNNER_TEMP/apple-store-in-use-captures-tvos"

      - name: Capture tvOS app with native LOCALTEST trial history
        if: inputs.target == 'tvos-in-use-capture-only' || inputs.target == 'tvos-in-use-producer-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
          PRODUCER_RUN_ID: ${{ inputs.target == 'tvos-in-use-producer-only' && github.run_id || inputs.tvos_artifact_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.target == 'tvos-in-use-producer-only' && github.run_attempt || steps.producer.outputs.run_attempt }}
          TVOS_DEPENDENCY_RECEIPT: ${{ inputs.target == 'tvos-in-use-producer-only' && format('{0}/tvos-runtime-dependency-receipt.json', runner.temp) || '' }}
        run: |
          set -euo pipefail
          args=(
            --platform tvos \
            --product-root "$GITHUB_WORKSPACE" \
            --capture-tools-root "$GITHUB_WORKSPACE/capture-tools" \
            --capture-tools-sha "$PLEAZYNG_CAPTURE_TOOLS_SHA" \
            --app "$APPLE_STORE_APP_PATH" \
            --build-receipt "$APPLE_STORE_BUILD_RECEIPT" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --runner-root "$RUNNER_TEMP/pleazyng-storekit-review-tvos" \
            --output-dir "$RUNNER_TEMP/apple-store-in-use-captures-tvos" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          if [[ -n "$TVOS_DEPENDENCY_RECEIPT" ]]; then
            args+=(--dependency-receipt "$TVOS_DEPENDENCY_RECEIPT")
          fi
          python3 capture-tools/scripts/stores/capture_apple_macos_tvos_storekit.py capture "${args[@]}"

      - name: Retain standard tvOS app screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-listing-only' && inputs.target != 'tvos-in-use-capture-only' && inputs.target != 'tvos-in-use-producer-only' && inputs.target != 'macos-tvos-in-use-producer-only'
        with:
          name: apple-store-captures-tvos-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-captures-tvos/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && (inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-listing-only' || inputs.target == 'tvos-in-use-capture-only' || inputs.target == 'tvos-in-use-producer-only' || inputs.target == 'macos-tvos-in-use-producer-only')
        with:
          name: apple-store-in-use-captures-tvos-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-in-use-captures-tvos/
          if-no-files-found: warn
          retention-days: 7

  macos:
    if: github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'ios-macos-only' || inputs.target == 'macos-only' || inputs.target == 'capture-only' || inputs.target == 'macos-paywall-capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'macos-in-use-capture-only' || inputs.target == 'macos-listing-capture-only' || inputs.target == 'macos-in-use-diagnostic-only' || inputs.target == 'macos-tvos-in-use-producer-only')
    concurrency:
      group: pleazyng-apple-store-screenshots-macos
      cancel-in-progress: false
      queue: max
    runs-on: ${{ (inputs.target == 'macos-in-use-capture-only' || inputs.target == 'macos-listing-capture-only') && 'xcode-27' || 'macos-26-intel' }}
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.product_source_tag || 'v3.0.37-candidate.28f417ab17a4b6dc4c2e422b27662c62f62be7fb' }}
          fetch-depth: ${{ inputs.frozen_product_source_sha != '' && 2 || 1 }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: capture-tools
          persist-credentials: false

      - name: Verify the exact product source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.product_source_sha || '28f417ab17a4b6dc4c2e422b27662c62f62be7fb' }}
          EXPECTED_SOURCE_TAG: ${{ inputs.product_source_tag || 'v3.0.37-candidate.28f417ab17a4b6dc4c2e422b27662c62f62be7fb' }}
          EXPECTED_VERSION: ${{ inputs.product_version || '3.0.37' }}
          EXPECTED_BUILD: ${{ inputs.product_build || '196' }}
          DYNAMIC_SOURCE_REQUIRED: ${{ inputs.product_source_tag != '' || inputs.product_source_sha != '' || inputs.product_version != '' || inputs.product_build != '' || inputs.frozen_product_source_sha != '' || inputs.frozen_product_source_tag != '' }}
          FROZEN_PRODUCT_SOURCE_SHA: ${{ inputs.frozen_product_source_sha }}
          FROZEN_PRODUCT_SOURCE_TAG: ${{ inputs.frozen_product_source_tag }}
          INPUT_PRODUCT_SOURCE_SHA: ${{ inputs.product_source_sha }}
          INPUT_PRODUCT_SOURCE_TAG: ${{ inputs.product_source_tag }}
          INPUT_PRODUCT_VERSION: ${{ inputs.product_version }}
          INPUT_PRODUCT_BUILD: ${{ inputs.product_build }}
        run: |
          set -euo pipefail
          if [[ "$DYNAMIC_SOURCE_REQUIRED" == true ]]; then
            [[ -n "$INPUT_PRODUCT_SOURCE_SHA" && -n "$INPUT_PRODUCT_SOURCE_TAG" ]]
            [[ -n "$INPUT_PRODUCT_VERSION" && -n "$INPUT_PRODUCT_BUILD" ]]
            [[ "$EXPECTED_SOURCE_SHA" == "$INPUT_PRODUCT_SOURCE_SHA" ]]
            [[ "$EXPECTED_SOURCE_TAG" == "$INPUT_PRODUCT_SOURCE_TAG" ]]
            [[ "$EXPECTED_VERSION" == "$INPUT_PRODUCT_VERSION" ]]
            [[ "$EXPECTED_BUILD" == "$INPUT_PRODUCT_BUILD" ]]
            [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EXPECTED_SOURCE_TAG" == "v$EXPECTED_VERSION-candidate.$EXPECTED_SOURCE_SHA" ]]
            [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$EXPECTED_BUILD" =~ ^[0-9]+$ ]]
            if [[ -n "$FROZEN_PRODUCT_SOURCE_SHA" || -n "$FROZEN_PRODUCT_SOURCE_TAG" ]]; then
              [[ "$FROZEN_PRODUCT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$FROZEN_PRODUCT_SOURCE_TAG" == "v$EXPECTED_VERSION-candidate.$FROZEN_PRODUCT_SOURCE_SHA" ]]
              git fetch --no-tags origin "refs/tags/$FROZEN_PRODUCT_SOURCE_TAG:refs/tags/$FROZEN_PRODUCT_SOURCE_TAG"
            fi
          fi
          test "$(git cat-file -t "refs/tags/$EXPECTED_SOURCE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$EXPECTED_SOURCE_TAG^{commit}")" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_SOURCE_SHA...$GITHUB_SHA" --jq .merge_base_commit.sha)"
          test "$merge_base" = "$EXPECTED_SOURCE_SHA"
          test "$(python3 scripts/pubspec_version.py)" = "$EXPECTED_VERSION+$EXPECTED_BUILD"

      - name: Probe and select native Mac display mode before downloading the app
        if: inputs.target == 'macos-listing-capture-only'
        run: |
          set -euo pipefail
          probe_dir="$RUNNER_TEMP/apple-store-in-use-captures-macos"
          mkdir -p "$probe_dir"
          cat > "$RUNNER_TEMP/mac-display-capability.swift" <<'SWIFT'
          import AppKit
          import CoreGraphics
          import Foundation

          _ = NSApplication.shared
          let displayID = CGMainDisplayID()
          let bounds = CGDisplayBounds(displayID)
          let modes = (CGDisplayCopyAllDisplayModes(displayID, nil) as? [CGDisplayMode]) ?? []
          func record(_ mode: CGDisplayMode) -> [String: Any] {
            [
              "points": [Double(mode.width), Double(mode.height)],
              "pixels": [mode.pixelWidth, mode.pixelHeight],
              "refresh_rate_hz": mode.refreshRate,
              "usable_for_desktop_gui": mode.isUsableForDesktopGUI(),
            ]
          }
          var currentMode: Any = NSNull()
          if let mode = CGDisplayCopyDisplayMode(displayID) { currentMode = record(mode) }
          let windowCaptureMode = modes.first(where: {
            $0.width == 1920 && $0.height == 1080 && $0.pixelWidth == 1920 && $0.pixelHeight == 1080
              && $0.isUsableForDesktopGUI()
          })
          var selectedModeEvidence: Any = NSNull()
          var activeMode: Any = NSNull()
          var displayModeActivated = false
          if let windowCaptureMode {
            selectedModeEvidence = record(windowCaptureMode)
            let status = CGDisplaySetDisplayMode(displayID, windowCaptureMode, nil)
            if status == .success, let readback = CGDisplayCopyDisplayMode(displayID),
               readback.width == 1920, readback.height == 1080,
               readback.pixelWidth == 1920, readback.pixelHeight == 1080 {
              activeMode = record(readback)
              displayModeActivated = true
            }
          }
          let result: [String: Any] = [
            "host_architecture": ProcessInfo.processInfo.environment["RUNNER_ARCH"] ?? "unknown",
            "main_display_id": Int(displayID),
            "main_display_bounds_points": [Double(bounds.width), Double(bounds.height)],
            "current_mode": currentMode,
            "enumerated_mode_count": modes.count,
            "enumerated_modes": modes.map(record),
            "target_window_points": [1280, 800],
            "window_capture_display_mode": selectedModeEvidence,
            "active_mode_after_selection": activeMode,
            "display_mode_activated": displayModeActivated,
            "selected_display_mode_is_native": true,
          ]
          let data = try JSONSerialization.data(withJSONObject: result, options: [.prettyPrinted, .sortedKeys])
          let path = URL(fileURLWithPath: CommandLine.arguments[1])
          try data.write(to: path, options: .atomic)
          print(String(decoding: data, as: UTF8.self))
          guard displayModeActivated else { exit(3) }
          SWIFT
          swift "$RUNNER_TEMP/mac-display-capability.swift" "$probe_dir/macos-display-capability.json"

      - name: Verify the prior build artifact producer
        id: producer
        if: inputs.target == 'capture-only' || inputs.target == 'macos-paywall-capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'macos-in-use-capture-only' || inputs.target == 'macos-listing-capture-only' || inputs.target == 'macos-in-use-diagnostic-only'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'macos-in-use-capture-only' || inputs.target == 'macos-listing-capture-only' || inputs.target == 'macos-in-use-diagnostic-only') && inputs.macos_artifact_run_id || inputs.artifact_run_id }}
          PRODUCER_RUN_ATTEMPT_INPUT: ${{ inputs.macos_artifact_run_attempt }}
          CAPTURE_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RUN_ID" =~ ^[0-9]+$ ]]
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/apple-store-screenshots.yml" --jq .id)"
          [[ "$workflow_id" =~ ^[0-9]+$ ]]
          if [[ -n "$PRODUCER_RUN_ATTEMPT_INPUT" ]]; then
            case "$CAPTURE_TARGET" in
              app-in-use-capture-only|macos-in-use-capture-only|macos-listing-capture-only|macos-in-use-diagnostic-only) ;;
              *) echo "An explicit Mac producer attempt is unsupported for target $CAPTURE_TARGET" >&2; exit 1 ;;
            esac
            [[ "$PRODUCER_RUN_ATTEMPT_INPUT" =~ ^[1-9][0-9]*$ ]]
            run_json="$RUNNER_TEMP/apple-store-producer-run.json"
            attempt_json="$RUNNER_TEMP/apple-store-producer-attempt.json"
            jobs_json="$RUNNER_TEMP/apple-store-producer-attempt-jobs.json"
            artifacts_json="$RUNNER_TEMP/apple-store-producer-artifacts.json"
            selection_receipt="$RUNNER_TEMP/apple-store-producer-selection.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" > "$run_json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/attempts/$PRODUCER_RUN_ATTEMPT_INPUT" > "$attempt_json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/attempts/$PRODUCER_RUN_ATTEMPT_INPUT/jobs" > "$jobs_json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts" > "$artifacts_json"
            python3 capture-tools/scripts/verify_apple_capture_producer.py \
              --run-json "$run_json" \
              --attempt-json "$attempt_json" \
              --jobs-json "$jobs_json" \
              --artifacts-json "$artifacts_json" \
              --run-id "$PRODUCER_RUN_ID" \
              --attempt-number "$PRODUCER_RUN_ATTEMPT_INPUT" \
              --workflow-id "$workflow_id" \
              --artifact-name "apple-store-build-macos-$PLEAZYNG_CAPTURE_PRODUCT_VERSION" \
              --capture-target "$CAPTURE_TARGET" \
              --consumer-workflow-sha "$GITHUB_SHA" \
              --product-source-sha "$PLEAZYNG_CAPTURE_PRODUCT_SOURCE_SHA" \
              --product-version "$PLEAZYNG_CAPTURE_PRODUCT_VERSION" \
              --product-build "$PLEAZYNG_CAPTURE_PRODUCT_BUILD" \
              --output "$selection_receipt" \
              --github-output "$GITHUB_OUTPUT"
          else
            metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" \
              --jq "if .workflow_id == $workflow_id and .event == \"workflow_dispatch\" and .head_branch == \"main\" and .status == \"completed\" then [.head_sha, (.run_attempt | tostring)] | @tsv else error(\"build producer is not a completed main-branch Apple Store Screenshots dispatch\") end")"
            IFS=$'\t' read -r tool_sha run_attempt <<< "$metadata"
            [[ "$tool_sha" =~ ^[0-9a-f]{40}$ && "$run_attempt" =~ ^[0-9]+$ ]]
            echo "tool_sha=$tool_sha" >> "$GITHUB_OUTPUT"
            echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          fi

      - name: Download prior macOS build
        if: inputs.target == 'capture-only' || inputs.target == 'macos-paywall-capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'macos-in-use-capture-only' || inputs.target == 'macos-listing-capture-only' || inputs.target == 'macos-in-use-diagnostic-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-store-build-macos-${{ inputs.product_version || '3.0.37' }}
          run-id: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'macos-in-use-capture-only' || inputs.target == 'macos-listing-capture-only' || inputs.target == 'macos-in-use-diagnostic-only') && inputs.macos_artifact_run_id || inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apple-store-build-macos-input

      - name: Validate and restore prior macOS build
        if: inputs.target == 'capture-only' || inputs.target == 'macos-paywall-capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'macos-in-use-capture-only' || inputs.target == 'macos-listing-capture-only' || inputs.target == 'macos-in-use-diagnostic-only'
        env:
          PRODUCER_RUN_ID: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'macos-in-use-capture-only' || inputs.target == 'macos-listing-capture-only' || inputs.target == 'macos-in-use-diagnostic-only') && inputs.macos_artifact_run_id || inputs.artifact_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.run_attempt }}
          PRODUCER_TOOLS_SHA: ${{ steps.producer.outputs.tool_sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py restore-build \
            --product-root "$GITHUB_WORKSPACE" \
            --artifact-dir "$RUNNER_TEMP/apple-store-build-macos-input" \
            --platform macos \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --expected-capture-tools-sha "$PRODUCER_TOOLS_SHA" \
            --output-dir "$RUNNER_TEMP/apple-store-build-macos-restored"
          echo "APPLE_STORE_APP_PATH=$RUNNER_TEMP/apple-store-build-macos-restored/Pleazyng.app" >> "$GITHUB_ENV"
          echo "APPLE_STORE_BUILD_RECEIPT=$RUNNER_TEMP/apple-store-build-macos-restored/build-provenance.json" >> "$GITHUB_ENV"

      - name: Select supported Xcode and macOS SDK for retained-app capture
        if: inputs.target == 'macos-in-use-capture-only'
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          [[ "$(xcodebuild -version | sed -n '1p')" == 'Xcode 27.2' ]]
          [[ "$(xcrun --sdk macosx --show-sdk-version)" == '27.2' ]]

      - name: Select supported Xcode for Mac OCR capture
        if: inputs.target == 'macos-listing-capture-only'
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          [[ "$(xcodebuild -version | sed -n '1p')" == 'Xcode 27.2' ]]
          [[ "$(xcrun --sdk macosx --show-sdk-version)" == '27.2' ]]

      - name: Load pinned Flutter SDK
        if: inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only'
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Install XcodeGen for native Mac UI capture
        if: inputs.target == 'macos-in-use-capture-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v xcodegen >/dev/null || brew install xcodegen
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Setup Flutter
        if: inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only'
        uses: ./.github/actions/setup-flutter-apple
        with:
          hosted-xcode-version: '26.5'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub dependencies
        if: inputs.target != 'capture-only' && inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PUB_CACHE }}
          key: apple-store-macos-v${{ inputs.product_version || '3.0.37' }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Install native build tools
        if: inputs.target != 'capture-only' && inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v git-lfs >/dev/null || brew install git-lfs

      - name: Install CocoaPods
        if: inputs.target != 'capture-only' && inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" \
            --bindir "$RUNNER_TEMP/cocoapods-bin"
          {
            echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"
            echo "GEM_PATH=$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"

      - name: Install locked Flutter dependencies
        if: inputs.target != 'capture-only' && inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only'
        run: flutter pub get --enforce-lockfile --no-example

      - name: Prefetch checksum-pinned macOS native downloads
        if: inputs.target != 'capture-only' && inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only'
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform macos

      - name: Prepare run-local Swift package checkout
        if: inputs.target != 'capture-only' && inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only'
        run: mkdir -p build/macos/SourcePackages

      - name: Refresh pinned macOS Swift packages
        if: inputs.target != 'capture-only' && inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only'
        env:
          PLEAZYNG_APPLE_SOURCE_ROOT: ${{ github.workspace }}
        run: capture-tools/scripts/refresh_apple_spm.sh macos

      - name: Build the unsigned Mac App Store candidate
        if: inputs.target != 'capture-only' && inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only'
        env:
          PLEAZYNG_APPLE_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 capture-tools/scripts/build_macos_app_store_candidate.py \
            --source-sha "$PLEAZYNG_CAPTURE_PRODUCT_SOURCE_SHA" \
            --output-dir "$RUNNER_TEMP/apple-store-macos-candidate" \
            --derived-data-dir "$RUNNER_TEMP/apple-store-macos-derived-data"

      - name: Preserve the compiled unsigned Mac app before capture
        if: inputs.target != 'capture-only' && inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py preserve-build \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$RUNNER_TEMP/apple-store-macos-candidate/Pleazyng.xcarchive/Products/Applications/Pleazyng.app" \
            --platform macos \
            --source-lineage-root "$GITHUB_WORKSPACE/capture-tools" \
            --output-dir "$RUNNER_TEMP/apple-store-build-macos"
          echo "APPLE_STORE_APP_PATH=$RUNNER_TEMP/apple-store-macos-candidate/Pleazyng.xcarchive/Products/Applications/Pleazyng.app" >> "$GITHUB_ENV"
          echo "APPLE_STORE_BUILD_RECEIPT=$RUNNER_TEMP/apple-store-build-macos/build-provenance.json" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.target != 'capture-only' && inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only'
        with:
          name: apple-store-build-macos-${{ inputs.product_version || '3.0.37' }}
          path: |
            ${{ runner.temp }}/apple-store-build-macos/build-provenance.json
            ${{ runner.temp }}/apple-store-build-macos/pleazyng-apple-store-build-macos.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Capture the actual macOS app window
        if: inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only' && inputs.target != 'macos-tvos-in-use-producer-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py capture-macos \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$APPLE_STORE_APP_PATH" \
            --output-dir "$RUNNER_TEMP/apple-store-captures-macos"

      - name: Capture the real lifetime-access sheet from the restored Mac app
        if: inputs.target == 'macos-paywall-capture-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py capture-macos-paywall \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$APPLE_STORE_APP_PATH" \
            --build-receipt "$APPLE_STORE_BUILD_RECEIPT" \
            --output-dir "$RUNNER_TEMP/apple-store-iap-review-paywall"

      - name: Capture the local Files and Books screen and real Mac lifetime-access sheet
        if: inputs.target == 'app-in-use-capture-only' || inputs.target == 'macos-tvos-in-use-producer-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py capture-macos-in-use \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$APPLE_STORE_APP_PATH" \
            --build-receipt "$APPLE_STORE_BUILD_RECEIPT" \
            --output-dir "$RUNNER_TEMP/apple-store-in-use-captures-macos"

      - name: Capture Files and Books in the real native Mac window
        if: inputs.target == 'macos-listing-capture-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py capture-macos-listing-window \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$APPLE_STORE_APP_PATH" \
            --build-receipt "$APPLE_STORE_BUILD_RECEIPT" \
            --output-dir "$RUNNER_TEMP/apple-store-in-use-captures-macos"

      - name: Capture Mac app with native LOCALTEST trial history
        if: inputs.target == 'macos-in-use-capture-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
          PRODUCER_RUN_ID: ${{ inputs.macos_artifact_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.run_attempt }}
        run: |
          python3 capture-tools/scripts/stores/capture_apple_macos_tvos_storekit.py capture \
            --platform macos \
            --product-root "$GITHUB_WORKSPACE" \
            --capture-tools-root "$GITHUB_WORKSPACE/capture-tools" \
            --capture-tools-sha "$PLEAZYNG_CAPTURE_TOOLS_SHA" \
            --app "$APPLE_STORE_APP_PATH" \
            --build-receipt "$APPLE_STORE_BUILD_RECEIPT" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --runner-root "$RUNNER_TEMP/pleazyng-storekit-review-macos" \
            --output-dir "$RUNNER_TEMP/apple-store-in-use-captures-macos" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Diagnose the retained Mac app without rebuilding
        if: inputs.target == 'macos-in-use-diagnostic-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py diagnose-macos-in-use \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$APPLE_STORE_APP_PATH" \
            --build-receipt "$APPLE_STORE_BUILD_RECEIPT" \
            --output-dir "$RUNNER_TEMP/apple-store-in-use-diagnostics-macos"

      - name: Preserve selected Mac producer attempt evidence
        if: always() && inputs.target == 'macos-in-use-diagnostic-only' && inputs.macos_artifact_run_attempt != ''
        env:
          PRODUCER_SELECTION_RECEIPT: ${{ steps.producer.outputs.selection_path }}
        run: |
          set -euo pipefail
          if [[ -n "$PRODUCER_SELECTION_RECEIPT" && -f "$PRODUCER_SELECTION_RECEIPT" ]]; then
            mkdir -p "$RUNNER_TEMP/apple-store-in-use-diagnostics-macos"
            cp "$PRODUCER_SELECTION_RECEIPT" "$RUNNER_TEMP/apple-store-in-use-diagnostics-macos/producer-selection.json"
          else
            echo "::warning::Selected producer attempt receipt was not created before failure."
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.target != 'macos-paywall-capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'macos-in-use-capture-only' && inputs.target != 'macos-listing-capture-only' && inputs.target != 'macos-in-use-diagnostic-only' && inputs.target != 'macos-tvos-in-use-producer-only'
        with:
          name: apple-store-captures-macos-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-captures-macos/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && (inputs.target == 'app-in-use-capture-only' || inputs.target == 'macos-in-use-capture-only' || inputs.target == 'macos-listing-capture-only' || inputs.target == 'macos-tvos-in-use-producer-only')
        with:
          name: apple-store-in-use-captures-macos-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-in-use-captures-macos/
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.target == 'macos-in-use-diagnostic-only'
        with:
          name: apple-store-in-use-diagnostics-macos-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-in-use-diagnostics-macos/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.target == 'macos-paywall-capture-only'
        with:
          name: pleazyng-apple-iap-review-paywall-macos-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-iap-review-paywall/
          if-no-files-found: error
          retention-days: 90

  package:
    if: >-
      always() && github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main' &&
      ((inputs.target == 'all' && needs.ios.result == 'success' && needs.tvos.result == 'success' && needs.macos.result == 'success') ||
       (inputs.target == 'capture-only' && inputs.artifact_run_id != '' && needs.ios.result == 'success' && needs.tvos.result == 'success' && needs.macos.result == 'success') ||
       (inputs.target == 'app-in-use-capture-only' && inputs.ios_artifact_run_id != '' && inputs.macos_artifact_run_id != '' && inputs.tvos_artifact_run_id != '' && needs.ios.result == 'success' && needs.tvos.result == 'success' && needs.macos.result == 'success') ||
       (inputs.target == 'ios-macos-only' && inputs.artifact_run_id != '' && needs.ios.result == 'success' && needs.macos.result == 'success') ||
       (inputs.target == 'macos-only' && inputs.artifact_run_id != '' && needs.macos.result == 'success'))
    needs: [ios, tvos, macos]
    concurrency:
      group: pleazyng-apple-store-screenshots-package
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: capture-tools
          persist-credentials: false

      - name: Verify the prior artifact run and record its tool revision
        id: prior-run
        if: inputs.artifact_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_CAPTURE_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$PRIOR_CAPTURE_RUN_ID" =~ ^[0-9]+$ ]]
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/apple-store-screenshots.yml" --jq .id)"
          [[ "$workflow_id" =~ ^[0-9]+$ ]]
          tool_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CAPTURE_RUN_ID" \
            --jq "if .workflow_id == $workflow_id and .event == \"workflow_dispatch\" and .head_branch == \"main\" and .status == \"completed\" then .head_sha else error(\"prior run is not a completed main-branch Apple Store Screenshots dispatch\") end")"
          [[ "$tool_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "tool_sha=$tool_sha" >> "$GITHUB_OUTPUT"

      - name: Download iOS captures
        if: inputs.target == 'all' || inputs.target == 'ios-macos-only' || inputs.target == 'capture-only' || inputs.target == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-store-captures-ios-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-captures-ios

      - name: Reuse iOS captures from a completed run
        if: inputs.target == 'macos-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-store-captures-ios-${{ inputs.product_version || '3.0.37' }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apple-store-captures-ios

      - name: Download app-in-use iOS captures
        if: inputs.target == 'app-in-use-capture-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-store-in-use-captures-ios-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-in-use-captures-ios

      - name: Download tvOS captures
        if: inputs.target == 'all' || inputs.target == 'capture-only' || inputs.target == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-store-captures-tvos-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-captures-tvos

      - name: Reuse tvOS captures from a completed run
        if: inputs.target == 'ios-macos-only' || inputs.target == 'macos-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-store-captures-tvos-${{ inputs.product_version || '3.0.37' }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apple-store-captures-tvos

      - name: Download app-in-use tvOS captures
        if: inputs.target == 'app-in-use-capture-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-store-in-use-captures-tvos-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-in-use-captures-tvos

      - name: Download macOS captures
        if: inputs.target != 'app-in-use-capture-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-store-captures-macos-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-captures-macos

      - name: Download app-in-use macOS captures
        if: inputs.target == 'app-in-use-capture-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-store-in-use-captures-macos-${{ inputs.product_version || '3.0.37' }}
          path: ${{ runner.temp }}/apple-store-in-use-captures-macos

      - name: Verify and package the Apple screenshot set
        if: inputs.target != 'app-in-use-capture-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
          LEGACY_TOOL_SOURCE_SHA: ${{ steps.prior-run.outputs.tool_sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py package \
            --ios-dir "$RUNNER_TEMP/apple-store-captures-ios" \
            --tvos-dir "$RUNNER_TEMP/apple-store-captures-tvos" \
            --macos-dir "$RUNNER_TEMP/apple-store-captures-macos" \
            --output-dir "$RUNNER_TEMP/apple-store-screenshots-${{ inputs.product_version || '3.0.37' }}" \
            --legacy-tool-source-sha "$LEGACY_TOOL_SOURCE_SHA"

      - name: Verify and package the app-in-use review screenshots
        if: inputs.target == 'app-in-use-capture-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py package-app-in-use \
            --ios-dir "$RUNNER_TEMP/apple-store-in-use-captures-ios" \
            --tvos-dir "$RUNNER_TEMP/apple-store-in-use-captures-tvos" \
            --macos-dir "$RUNNER_TEMP/apple-store-in-use-captures-macos" \
            --output-dir "$RUNNER_TEMP/apple-store-in-use-screenshots-${{ inputs.product_version || '3.0.37' }}"

      - name: Attest the screenshot package
        if: inputs.target != 'app-in-use-capture-only'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.temp }}/apple-store-screenshots-${{ inputs.product_version || '3.0.37' }}.zip

      - name: Attest the app-in-use screenshot package
        if: inputs.target == 'app-in-use-capture-only'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.temp }}/apple-store-in-use-screenshots-${{ inputs.product_version || '3.0.37' }}.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.target != 'app-in-use-capture-only'
        with:
          name: pleazyng-apple-store-screenshots-${{ inputs.product_version || '3.0.37' }}
          path: |
            ${{ runner.temp }}/apple-store-screenshots-${{ inputs.product_version || '3.0.37' }}/
            ${{ runner.temp }}/apple-store-screenshots-${{ inputs.product_version || '3.0.37' }}.zip
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.target == 'app-in-use-capture-only'
        with:
          name: pleazyng-apple-store-in-use-screenshots-${{ inputs.product_version || '3.0.37' }}
          path: |
            ${{ runner.temp }}/apple-store-in-use-screenshots-${{ inputs.product_version || '3.0.37' }}/
            ${{ runner.temp }}/apple-store-in-use-screenshots-${{ inputs.product_version || '3.0.37' }}.zip
          if-no-files-found: error
          retention-days: 90
