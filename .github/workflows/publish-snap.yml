# ng-runner-policy: hosted-default-v2
name: Publish Snap Store packages
run-name: ${{ format('action:{0}:pool:{1}:tag:{2}:channel:{3}', inputs.action, inputs.runner_pool, inputs.release_tag, inputs.channel) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Publication action authorized on the protected default branch
        required: true
        type: choice
        options: [publish-snap, refresh-snap]
      runner_pool:
        description: Runner pool for this publication
        required: true
        type: choice
        options: [public]
      release_tag:
        description: Published Pleazyng release tag
        required: true
        type: string
      channel:
        description: Snap Store channel for this revision
        required: true
        default: edge
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable

# Several publication gates run before checkout on public hosted runners.
env:
  GH_REPO: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: snap-channel-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false
  queue: max

jobs:
  resolve-release:
    name: Resolve published release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Require main for manual publication
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Snap publication may only be dispatched from main." >&2
            exit 1
          fi

      - name: Validate the published release
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic-version tag, got: $tag" >&2
            exit 1
          fi
          metadata="$(gh release view "$tag" --json isDraft,isPrerelease)"
          if [[ "$(jq -r '.isDraft' <<<"$metadata")" != "false" || "$(jq -r '.isPrerelease' <<<"$metadata")" != "false" ]]; then
            echo "Snap publication requires a published stable GitHub Release." >&2
            exit 1
          fi
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type')"
          if [[ "$tag_type" == "tag" ]]; then
            tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_ref" --jq '.object.sha')"
          fi
          main_ref="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$tag_ref...$main_ref" --jq '.status')"
          if [[ "$comparison" != "ahead" && "$comparison" != "identical" ]]; then
            echo "Release $tag is not on main or an ancestor of main." >&2
            exit 1
          fi
          channel=stable
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            channel="$INPUT_CHANNEL"
          fi
          case "$channel" in
            edge|beta|candidate|stable) ;;
            *) echo "Unsupported Snap Store channel: $channel" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  refresh:
    name: Refresh ${{ matrix.arch }} Snap dependencies
    needs: resolve-release
    if: inputs.action == 'refresh-snap'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            snap_arch: amd64
          - arch: arm64
            snap_arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Stage the verified release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/linux/packaging/snap"
          asset="pleazyng-linux-${ARCH}.tar.gz"
          cd "$RUNNER_TEMP"
          gh release download "$RELEASE_TAG" -p "$asset" -p SHA256SUMS.txt
          awk -v name="$asset" '$2 == name {print; matches++} END {exit matches != 1}' SHA256SUMS.txt | tee bundle.sha256
          sha256sum --check --strict bundle.sha256
          mkdir "$project/src" "$project/gui"
          tar --no-same-owner -xzf "$asset" -C "$project/src"
          install -m755 "$project/src/pleazyng.sh" "$project/pleazyng.sh"
          install -m644 "$project/src/pleazyng.png" "$project/gui/pleazyng.png"
          install -m644 "$project/pleazyng.desktop" "$project/gui/pleazyng.desktop"
          sed -i "s/^version: .*/version: '${RELEASE_TAG#v}'/" "$project/snapcraft.yaml"

      - name: Build and verify the refreshed Snap
        id: snap
        env:
          PLEZYNG_ALLOW_PUBLIC_SNAP: 'true'
        run: bash scripts/build_snap.sh '${{ matrix.snap_arch }}'

      - name: Record the refreshed package digest
        env:
          SNAP_PATH: ${{ steps.snap.outputs.snap }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir "$RUNNER_TEMP/pleazyng-snap"
          cd "$RUNNER_TEMP/pleazyng-snap"
          cp "$SNAP_PATH" "pleazyng-linux-${ARCH}.snap"
          sha256sum "pleazyng-linux-${ARCH}.snap" | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: refreshed-snap-${{ matrix.arch }}
          path: ${{ runner.temp }}/pleazyng-snap/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish ${{ matrix.arch }} package
    needs: [resolve-release, refresh]
    if: >-
      ${{ !cancelled() && needs.resolve-release.result == 'success' &&
          ((inputs.action == 'publish-snap' && needs.refresh.result == 'skipped') ||
           (inputs.action == 'refresh-snap' && needs.refresh.result == 'success')) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Check out protected publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Snap Store credentials
        id: credentials
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [[ -n "$SNAPCRAFT_STORE_CREDENTIALS" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Missing Snap Store credentials::Configure SNAPCRAFT_STORE_CREDENTIALS before publishing."
            exit 1
          fi

      - name: Download release Snap
        if: inputs.action == 'publish-snap'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pleazyng-snap"
          gh release download "$RELEASE_TAG" \
            --pattern "pleazyng-linux-${ARCH}.snap" \
            --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/pleazyng-snap"
          test -s "$RUNNER_TEMP/pleazyng-snap/pleazyng-linux-${ARCH}.snap"
          cd "$RUNNER_TEMP/pleazyng-snap"
          sha256sum --check --status --ignore-missing SHA256SUMS.txt

      - name: Download verified refresh from this run
        if: inputs.action == 'refresh-snap'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed-snap-${{ matrix.arch }}
          path: ${{ runner.temp }}/pleazyng-snap

      - name: Check the packages and runtime libraries before publication
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if ! command -v unsquashfs >/dev/null || ! /usr/bin/python3 -c 'import yaml'; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends squashfs-tools python3-yaml
          fi
          /usr/bin/python3 scripts/checks/check_snap_libssh.py "$RUNNER_TEMP/pleazyng-snap/pleazyng-linux-${ARCH}.snap" "${ARCH/x64/amd64}"

      - name: Publish to Snap Store
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          ARCH: ${{ matrix.arch }}
          RELEASE_CHANNEL: ${{ needs.resolve-release.outputs.channel }}
        run: |
          bash scripts/publish_private_snap.sh \
            "$RUNNER_TEMP/pleazyng-snap/pleazyng-linux-${ARCH}.snap" "$RELEASE_CHANNEL"
