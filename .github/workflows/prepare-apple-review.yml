# ng-runner-policy: hosted-default-v2
name: Prepare an Apple review draft
run-name: ${{ inputs.inspect_only && 'inspect-apple-review' || (inputs.capture_run != '' || inputs.tvos_capture_run != '') && 'stage-apple-screenshot' || 'prepare-apple-review' }}:${{ inputs.release_tag }}:${{ inputs.platform }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag
        type: string
        required: true
      platform:
        description: App Store Connect platform
        type: choice
        options: [IOS, MAC_OS, TV_OS]
        required: true
      processing_run:
        description: Successful run that delivered the selected platform and verified Apple processing
        type: string
        required: true
      inspect_only:
        description: Read the draft, screenshot placements, and purchase states without editing
        type: boolean
        default: false
      capture_run:
        description: Successful platform job run supplying the exact Open media screenshot
        type: string
        required: false
      tvos_capture_run:
        description: Existing alias for capture_run on tvOS
        type: string
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: apple-review-draft-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  attach:
    if: github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate the published release and exact processing run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PLATFORM: ${{ inputs.platform }}
          PROCESSING_RUN: ${{ inputs.processing_run }}
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$PROCESSING_RUN" =~ ^[1-9][0-9]*$ ]]
          case "$PLATFORM" in
            MAC_OS)
              workflow=macos-app-store-signed.yml
              title="macos-app-store:signed-upload:$RELEASE_TAG"
              ;;
            IOS|TV_OS)
              workflow=publish-app-stores.yml
              channel=app-store-ios
              if [[ "$PLATFORM" == TV_OS ]]; then channel=app-store-tvos; fi
              title="action:publish-app-stores:pool:public:tag:$RELEASE_TAG:channel:$channel"
              ;;
            *) exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROCESSING_RUN" |
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg title "$title" --arg path ".github/workflows/$workflow" \
              '.display_title == $title and .path == $path and .head_branch == "main" and
               .repository.full_name == $repo and .head_repository.full_name == $repo and
               .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" |
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false and .published_at != null' >/dev/null
          source="$(python3 -c 'import sys; from refresh_release_facts import tag_commit; print(tag_commit(sys.argv[1]))' "$RELEASE_TAG")"
          spec="$(gh api "repos/$GITHUB_REPOSITORY/contents/pubspec.yaml?ref=$source" --jq .content | base64 -d)"
          version_build="$(printf '%s\n' "$spec" | python3 scripts/pubspec_version.py /dev/stdin)"
          [[ "$version_build" == "${RELEASE_TAG#v}"+* ]]
          printf 'version=%s\nbuild_number=%s\nsource=%s\n' "${RELEASE_TAG#v}" "${version_build##*+}" "$source" >> "$GITHUB_OUTPUT"

      - name: Require the exact successful Apple screenshot capture job
        id: capture
        if: inputs.capture_run != '' || inputs.tvos_capture_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUN: ${{ inputs.capture_run || inputs.tvos_capture_run }}
          TVOS_CAPTURE_RUN: ${{ inputs.tvos_capture_run }}
          PLATFORM: ${{ inputs.platform }}
          INSPECT_ONLY: ${{ inputs.inspect_only }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$CAPTURE_RUN" =~ ^[1-9][0-9]*$ && "$INSPECT_ONLY" != true ]]
          [[ -z "$TVOS_CAPTURE_RUN" || ( "$PLATFORM" == TV_OS && "$TVOS_CAPTURE_RUN" == "$CAPTURE_RUN" ) ]]
          case "$PLATFORM" in
            IOS) lane=ios ;;
            MAC_OS) lane=macos ;;
            TV_OS) lane=tvos ;;
            *) exit 1 ;;
          esac
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg title "apple-store-screenshots:$VERSION" '
            .head_branch == "main" and .head_repository.full_name == $repo and
            .repository.full_name == $repo and .path == ".github/workflows/apple-store-screenshots.yml" and
            .event == "workflow_dispatch" and .status == "completed" and
            .display_title == $title and (.head_sha | test("^[0-9a-f]{40}$")) and .run_attempt > 0' <<< "$run" >/dev/null
          attempt="$(jq -r .run_attempt <<< "$run")"
          job="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN/attempts/$attempt/jobs" |
            jq -e --arg lane "$lane" '[.jobs[] | select(.name == $lane)] |
              select(length == 1 and .[0].status == "completed" and .[0].conclusion == "success") | .[0]')"
          artifact_name="apple-store-in-use-captures-$lane-$VERSION"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN/artifacts?name=$artifact_name" |
            jq -er --arg name "$artifact_name" --argjson job "$job" '[.artifacts[] |
              select(.name == $name and .expired == false and (.digest | test("^sha256:[0-9a-f]{64}$")) and
                     (.created_at >= $job.started_at and .created_at <= $job.completed_at))] |
              select(length == 1) | .[0].id')"
          printf 'artifact_id=%s\nattempt=%s\nsource=%s\n' "$artifact_id" "$attempt" "$(jq -r .head_sha <<< "$run")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.capture.outcome == 'success'
        with:
          artifact-ids: ${{ steps.capture.outputs.artifact_id }}
          run-id: ${{ inputs.capture_run || inputs.tvos_capture_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apple-listing-capture

      - name: Inspect or attach the processed build to the existing draft
        if: inputs.capture_run == '' && inputs.tvos_capture_run == ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          INSPECT_ONLY: ${{ inputs.inspect_only }}
          PYTHONPATH: scripts
        run: |
          args=()
          if [[ "$INSPECT_ONLY" == true ]]; then args+=(--inspect-only); fi
          python3 scripts/stores/prepare_apple_review_draft.py --platform "$PLATFORM" --version "$VERSION" \
            --build-number "$BUILD_NUMBER" --receipt "$RUNNER_TEMP/apple-review-draft.json" "${args[@]}"

      - name: Place the verified screenshot in the existing listing
        if: steps.capture.outcome == 'success'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          PRODUCT_SOURCE: ${{ steps.release.outputs.source }}
          CAPTURE_RUN: ${{ inputs.capture_run || inputs.tvos_capture_run }}
          CAPTURE_ATTEMPT: ${{ steps.capture.outputs.attempt }}
          CAPTURE_WORKFLOW_SOURCE: ${{ steps.capture.outputs.source }}
          PYTHONPATH: scripts
        run: |
          python3 scripts/stores/stage_apple_listing_screenshot.py --platform "$PLATFORM" --version "$VERSION" --build "$BUILD_NUMBER" \
            --source "$PRODUCT_SOURCE" --capture-run "$CAPTURE_RUN" --capture-attempt "$CAPTURE_ATTEMPT" \
            --capture-workflow-source "$CAPTURE_WORKFLOW_SOURCE" --capture-dir "$RUNNER_TEMP/apple-listing-capture" \
            --receipt "$RUNNER_TEMP/apple-review-draft.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apple-review-draft-${{ inputs.platform }}-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/apple-review-draft.json
          if-no-files-found: error
