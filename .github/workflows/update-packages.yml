# Runner policy: public hosted runners; no private resources required.
name: Update Packages
run-name: ${{ format('action:{0}:pool:{1}:tag:{2}', inputs.action, inputs.runner_pool, inputs.release_tag) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Package update action
        required: true
        type: choice
        options: [update-packages]
      runner_pool:
        description: Runner pool for this update
        required: true
        type: choice
        options: [public]
      release_tag:
        description: Published release tag to update packages for
        required: true
        type: string

# Publication gates also run before a repository has been checked out.
env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: update-release-packages
  cancel-in-progress: false
  queue: max

jobs:
  resolve-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      homebrew_enabled: ${{ steps.release.outputs.homebrew_enabled }}
      homebrew_skip_reason: ${{ steps.release.outputs.homebrew_skip_reason }}
      homebrew_asset: ${{ steps.release.outputs.homebrew_asset }}
      homebrew_checksums: ${{ steps.release.outputs.homebrew_checksums }}
      homebrew_recovery: ${{ steps.release.outputs.homebrew_recovery }}
      homebrew_recovery_kind: ${{ steps.release.outputs.homebrew_recovery_kind }}
    steps:
      - name: Require the default branch for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            echo "Manual package updates may only run from the default branch." >&2
            exit 1
          fi

      - name: Resolve published release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            REQUESTED_TAG="$EVENT_TAG"
          else
            REQUESTED_TAG="$INPUT_TAG"
          fi

          if [ -z "$REQUESTED_TAG" ]; then
            echo "A release tag is required." >&2
            exit 1
          fi

          RELEASE=$(gh release view "$REQUESTED_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,publishedAt,assets)
          RESOLVED_TAG=$(jq -r '.tagName' <<< "$RELEASE")
          IS_PRERELEASE=$(jq -r '.isPrerelease' <<< "$RELEASE")
          IS_DRAFT=$(jq -r '.isDraft' <<< "$RELEASE")
          PUBLISHED_AT=$(jq -r '.publishedAt // empty' <<< "$RELEASE")

          if [ "$RESOLVED_TAG" != "$REQUESTED_TAG" ] || \
             [ "$IS_DRAFT" != "false" ] || [ -z "$PUBLISHED_AT" ]; then
            echo "Tag '$REQUESTED_TAG' is not an exact published release tag." >&2
            exit 1
          fi

          if [ "$IS_PRERELEASE" != "false" ]; then
            echo "Tag '$REQUESTED_TAG' is a pre-release; packages track stable releases only." >&2
            exit 1
          fi

          if [[ ! "$RESOLVED_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$RESOLVED_TAG' is not a stable semantic version." >&2
            exit 1
          fi
          VERSION="${RESOLVED_TAG#v}"
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RESOLVED_TAG" --jq '.object.sha')
          TAG_TYPE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RESOLVED_TAG" --jq '.object.type')
          if [ "$TAG_TYPE" = "tag" ]; then
            TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_SHA" --jq '.object.sha')
          fi
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          COMPARE_STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$TAG_SHA...$MAIN_SHA" --jq '.status')
          if [[ "$COMPARE_STATUS" != "ahead" && "$COMPARE_STATUS" != "identical" ]]; then
            echo "Release '$RESOLVED_TAG' is not on main or an ancestor of main." >&2
            exit 1
          fi

          if [[ -n "$HOMEBREW_TAP_TOKEN" && ! "$RESOLVED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Homebrew Cask URLs require a stable vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi

          echo "tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ -n "$MACOS_CERTIFICATE_BASE64" && -n "$MACOS_CERTIFICATE_PASSWORD" && \
                -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER_ID" && \
                -n "$APPLE_API_PRIVATE_KEY" && -n "$APPLE_TEAM_ID" && -n "$HOMEBREW_TAP_TOKEN" ]]; then
            CREDENTIALS_READY=true
          else
            CREDENTIALS_READY=false
          fi

          HAS_CASK_CANDIDATE=$(jq -r '[.assets[]?.name] | any(. == "snapetech-pleazyng.rb")' <<< "$RELEASE")
          RECOVERY_ASSET_COUNT=$(jq -r '[.assets[]?.name] | map(select(. == "pleazyng-macos-notarized.dmg" or . == "pleazyng-homebrew-SHA256SUMS.txt" or . == "pleazyng-homebrew-recovery.json")) | unique | length' <<< "$RELEASE")
          if [[ "$RECOVERY_ASSET_COUNT" != 0 && "$RECOVERY_ASSET_COUNT" != 3 ]]; then
            echo "Release $RESOLVED_TAG contains an incomplete Homebrew recovery asset set." >&2
            exit 1
          fi
          if [[ "$RECOVERY_ASSET_COUNT" == 3 && "$HAS_CASK_CANDIDATE" != true ]]; then
            echo "Release $RESOLVED_TAG has Homebrew recovery assets but no attested Cask candidate." >&2
            exit 1
          fi
          SKIP_REASONS=()
          if [[ "$HAS_CASK_CANDIDATE" != "true" ]]; then
            SKIP_REASONS+=("No snapetech-pleazyng.rb candidate is attached to this release.")
          fi
          if [[ "$CREDENTIALS_READY" != "true" ]]; then
            SKIP_REASONS+=("Developer ID signing, notarization, or HOMEBREW_TAP_TOKEN is missing.")
          fi

          if [[ "$RECOVERY_ASSET_COUNT" == 3 ]]; then
            echo "homebrew_asset=pleazyng-macos-notarized.dmg" >> "$GITHUB_OUTPUT"
            echo "homebrew_checksums=pleazyng-homebrew-SHA256SUMS.txt" >> "$GITHUB_OUTPUT"
            echo "homebrew_recovery=true" >> "$GITHUB_OUTPUT"
            if jq -e '[.assets[]?.name] | any(. == "platform-reuse-provenance.json")' <<< "$RELEASE" >/dev/null; then
              if [[ "$RESOLVED_TAG" == v3.0.51 ]]; then
                echo "homebrew_recovery_kind=legacy-assembly" >> "$GITHUB_OUTPUT"
              else
                echo "homebrew_recovery_kind=platform-assembly" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "homebrew_recovery_kind=direct-source" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "homebrew_asset=pleazyng-macos.dmg" >> "$GITHUB_OUTPUT"
            echo "homebrew_checksums=SHA256SUMS.txt" >> "$GITHUB_OUTPUT"
            echo "homebrew_recovery=false" >> "$GITHUB_OUTPUT"
            echo "homebrew_recovery_kind=none" >> "$GITHUB_OUTPUT"
          fi

          if ((${#SKIP_REASONS[@]})); then
            HOME_BREW_SKIP_REASON=$(IFS=' '; echo "${SKIP_REASONS[*]}")
            echo "homebrew_enabled=false" >> "$GITHUB_OUTPUT"
            echo "homebrew_skip_reason=$HOME_BREW_SKIP_REASON" >> "$GITHUB_OUTPUT"
            echo "::notice title=Homebrew Cask skipped::$HOME_BREW_SKIP_REASON"
            {
              echo "Homebrew Cask: skipped"
              echo
              echo "$HOME_BREW_SKIP_REASON"
              echo
              echo "Sparkle appcast delivery is handled by the core release and is independent of this Cask no-op."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "homebrew_enabled=true" >> "$GITHUB_OUTPUT"
            echo "homebrew_skip_reason=" >> "$GITHUB_OUTPUT"
          fi

  update-homebrew:
    needs: resolve-release
    if: needs.resolve-release.outputs.homebrew_enabled == 'true'
    # This job verifies the universal app's signature and notarization without running it.
    runs-on: macos-26-intel
    permissions:
      contents: read
      attestations: read
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
      HOMEBREW_ASSET_NAME: ${{ needs.resolve-release.outputs.homebrew_asset }}
      HOMEBREW_CHECKSUMS_NAME: ${{ needs.resolve-release.outputs.homebrew_checksums }}
      HOMEBREW_RECOVERY: ${{ needs.resolve-release.outputs.homebrew_recovery }}
      HOMEBREW_RECOVERY_KIND: ${{ needs.resolve-release.outputs.homebrew_recovery_kind }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify published Cask candidate and notarized disk image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pleazyng-homebrew"
          cd "$RUNNER_TEMP/pleazyng-homebrew"
          patterns=(--pattern "$HOMEBREW_ASSET_NAME" --pattern "$HOMEBREW_CHECKSUMS_NAME" \
            --pattern snapetech-pleazyng.rb)
          if [[ "$HOMEBREW_RECOVERY" == true ]]; then
            patterns+=(--pattern SHA256SUMS.txt --pattern pleazyng-homebrew-recovery.json)
            if [[ "$HOMEBREW_RECOVERY_KIND" == legacy-assembly || "$HOMEBREW_RECOVERY_KIND" == platform-assembly ]]; then
              patterns+=(--pattern platform-reuse-provenance.json)
            elif [[ "$HOMEBREW_RECOVERY_KIND" != direct-source ]]; then
              echo "Unknown Homebrew recovery provenance kind: $HOMEBREW_RECOVERY_KIND" >&2
              exit 1
            fi
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${patterns[@]}"
          python3 "$GITHUB_WORKSPACE/scripts/verify_release_attestation.py" snapetech-pleazyng.rb \
            --repo "$GITHUB_REPOSITORY" --repository-output "$RUNNER_TEMP/cask-publisher-repository.txt"
          python3 "$GITHUB_WORKSPACE/scripts/verify_release_attestation.py" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
          if [[ "$HOMEBREW_RECOVERY" == true ]]; then
            python3 "$GITHUB_WORKSPACE/scripts/verify_release_attestation.py" "$HOMEBREW_ASSET_NAME" --repo "$GITHUB_REPOSITORY"
            python3 "$GITHUB_WORKSPACE/scripts/verify_release_attestation.py" "$HOMEBREW_CHECKSUMS_NAME" --repo "$GITHUB_REPOSITORY"
            python3 "$GITHUB_WORKSPACE/scripts/verify_release_attestation.py" pleazyng-homebrew-recovery.json --repo "$GITHUB_REPOSITORY"
            if [[ "$HOMEBREW_RECOVERY_KIND" == legacy-assembly ]]; then
              python3 "$GITHUB_WORKSPACE/scripts/recover_macos_dmg_for_homebrew.py" verify \
                --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" \
                --core-checksums SHA256SUMS.txt --homebrew-checksums "$HOMEBREW_CHECKSUMS_NAME" \
                --platform-reuse platform-reuse-provenance.json \
                --receipt pleazyng-homebrew-recovery.json --asset "$HOMEBREW_ASSET_NAME"
            elif [[ "$HOMEBREW_RECOVERY_KIND" == platform-assembly ]]; then
              python3 "$GITHUB_WORKSPACE/scripts/recover_macos_dmg_for_homebrew_direct.py" verify \
                --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" \
                --core-checksums SHA256SUMS.txt --homebrew-checksums "$HOMEBREW_CHECKSUMS_NAME" \
                --platform-reuse platform-reuse-provenance.json \
                --receipt pleazyng-homebrew-recovery.json --asset "$HOMEBREW_ASSET_NAME"
            else
              python3 "$GITHUB_WORKSPACE/scripts/recover_macos_dmg_for_homebrew_direct.py" verify \
                --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" \
                --core-checksums SHA256SUMS.txt --homebrew-checksums "$HOMEBREW_CHECKSUMS_NAME" \
                --receipt pleazyng-homebrew-recovery.json --asset "$HOMEBREW_ASSET_NAME"
            fi
          fi
          python3 "$GITHUB_WORKSPACE/scripts/generate_homebrew_cask.py" \
            --version "$RELEASE_VERSION" --checksums "$HOMEBREW_CHECKSUMS_NAME" \
            --asset-name "$HOMEBREW_ASSET_NAME" --output expected.rb \
            --publisher-repository-file "$RUNNER_TEMP/cask-publisher-repository.txt"
          cmp expected.rb snapetech-pleazyng.rb
          EXPECTED_SHA=$(awk -v name="$HOMEBREW_ASSET_NAME" '$2 == name {print $1; count++} END {if (count != 1) exit 1}' "$HOMEBREW_CHECKSUMS_NAME")
          ACTUAL_SHA=$(shasum -a 256 "$HOMEBREW_ASSET_NAME" | cut -d' ' -f1)
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          # The released app carries its notarization ticket; the outer DMG
          # does not need a second ticket. Verify the exact immutable payload.
          mountpoint="$RUNNER_TEMP/pleazyng-homebrew/mounted"
          mkdir -p "$mountpoint"
          trap 'hdiutil detach "$mountpoint" || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$HOMEBREW_ASSET_NAME"
          app="$mountpoint/Pleazyng.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 \
            --test-requirement='=identifier "org.snapetech.pleazyng" and anchor apple generic and certificate leaf[subject.OU] = "DM9A59DC85"' "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"

      - name: Check out publisher tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: snapetech-org/homebrew-pleazyng
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: publisher-tap

      - name: Publish versioned Cask to publisher tap
        working-directory: publisher-tap
        run: |
          set -euo pipefail
          mkdir -p Casks
          python3 "$GITHUB_WORKSPACE/scripts/check_homebrew_cask_update.py" \
            --version "$RELEASE_VERSION" \
            --current Casks/snapetech-pleazyng.rb \
            --candidate "$RUNNER_TEMP/pleazyng-homebrew/snapetech-pleazyng.rb"
          cp "$RUNNER_TEMP/pleazyng-homebrew/snapetech-pleazyng.rb" Casks/snapetech-pleazyng.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/snapetech-pleazyng.rb
          if ! git diff --staged --quiet; then
            git commit -m "Update Pleazyng Cask to $RELEASE_TAG"
            git push origin HEAD
          else
            echo "No Cask changes to publish."
          fi
